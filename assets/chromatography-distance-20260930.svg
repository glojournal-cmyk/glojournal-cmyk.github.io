<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc"><title id="title">Chromatography distances measured from the baseline</title><desc id="desc">Baseline at 1.5 cm, spot centre at 5.5 cm, solvent front at 9.5 cm from the paper bottom. Spot distance is 4.0 cm; solvent distance is 8.0 cm.</desc><rect width="640" height="360" rx="20" fill="#f7f4eb"/><g font-family="sans-serif" fill="#173449" font-size="17"><rect x="50" y="30" width="180" height="270" fill="white" stroke="#173449" stroke-width="2"/><path d="M50 52h180" stroke="#789581" stroke-width="3"/><path d="M50 260h180" stroke="#173449" stroke-dasharray="5 4" stroke-width="2"/><circle cx="140" cy="156" r="12" fill="#a06ba2"/><circle cx="140" cy="260" r="4" fill="#173449"/><text x="270" y="57">Solvent front: 9.5 cm</text><text x="270" y="161">Spot centre: 5.5 cm</text><text x="270" y="265">Baseline: 1.5 cm</text><text x="270" y="303">Paper bottom: 0 cm</text><path d="M240 260V52m-5 8 5-8 5 8M235 252l5 8 5-8" stroke="#789581" stroke-width="2" fill="none"/><text x="50" y="335">Rf = (5.5 − 1.5) / (9.5 − 1.5) = 0.50</text></g></svg>
