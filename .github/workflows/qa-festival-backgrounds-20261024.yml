name: Festival Backgrounds iPad Safari and Chrome QA
on:
  push:
    branches: [main]
    paths:
      - qa/festival-backgrounds-20261024.mjs
      - .github/workflows/qa-festival-backgrounds-20261024.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright browsers
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Serve actual production site
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 > /tmp/gloria-festival-bg-http.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          curl -fIsS http://127.0.0.1:8787/art/scenes/festival/halloween.webp | head -n 4
      - name: Test festival thumbnails, selection, Home, Garden, persistence and records
        run: node qa/festival-backgrounds-20261024.mjs
      - name: Attach QA screenshots and structured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: festival-backgrounds-ipad-qa
          path: qa-artifacts/festival-backgrounds/
          if-no-files-found: ignore
