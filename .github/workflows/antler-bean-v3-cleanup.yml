name: Rebuild Antler Bean v3 cleanly

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/antler-bean-v3-cleanup.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Inspect git status and diff first
        run: |
          echo '--- git status --short ---'
          git status --short
          echo '--- incoming diff ---'
          git diff --stat HEAD^..HEAD
          git diff --check HEAD^..HEAD
          test "$(git rev-parse HEAD^)" = "19cd1d41d11fb46de1e4653f3a5edb9a17362053"

      - name: Guard Moss Hornling and Pebble Wisp
        run: |
          test "$(git hash-object pet/art-evolution-v3/moss-hornling.avif)" = "dec813e40ea6c5976f8a9bad107a4a9b1923413b"
          test "$(git hash-object pet/art-evolution-v3/pebble-wisp.avif)" = "221ce9e4ac718bcb7a869a0056dae92f59f16c15"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Rebuild Antler Bean from independent stage art
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('.')
          sources = [
              root / 'pet/art-master/antler-bean.png',
              root / 'pet/art-evolution/level-2/antler-bean.webp',
              root / 'pet/art-evolution/level-3/antler-bean.webp',
              root / 'pet/art-evolution/level-4/antler-bean.webp',
              root / 'pet/art-evolution/level-5/antler-bean.webp',
          ]
          for p in sources:
              assert p.exists() and p.stat().st_size > 1000, p

          CELL = 640
          # Deliberate size progression so the evolution is visually obvious.
          target_fracs = [0.58, 0.65, 0.74, 0.84, 0.92]
          cleaned = []

          for idx, (path, frac) in enumerate(zip(sources, target_fracs), 1):
              im = Image.open(path).convert('RGBA')
              alpha = im.getchannel('A')
              bbox = alpha.getbbox()
              assert bbox is not None, f'blank stage {idx}'
              subject = im.crop(bbox)

              max_w = int(CELL * frac)
              max_h = int(CELL * frac)
              scale = min(max_w / subject.width, max_h / subject.height)
              nw = max(1, round(subject.width * scale))
              nh = max(1, round(subject.height * scale))
              subject = subject.resize((nw, nh), Image.Resampling.LANCZOS)

              cell = Image.new('RGBA', (CELL, CELL), (0, 0, 0, 0))
              x = (CELL - nw) // 2
              # Bottom-align with a protected 30 px safety margin.
              y = CELL - nh - 30
              if y < 30:
                  y = 30
              cell.alpha_composite(subject, (x, y))

              cb = cell.getchannel('A').getbbox()
              assert cb is not None
              l, t, r, b = cb
              assert l >= 20 and t >= 20 and r <= CELL - 20 and b <= CELL - 20, (idx, cb)
              cleaned.append(cell)

          sheet = Image.new('RGBA', (CELL * 3, CELL * 2), (0, 0, 0, 0))
          slots = [(0,0), (1,0), (2,0), (0,1), (1,1)]
          for cell, (sx, sy) in zip(cleaned, slots):
              sheet.alpha_composite(cell, (sx * CELL, sy * CELL))

          out = root / 'pet/art-evolution-v3/antler-bean.webp'
          sheet.save(out, 'WEBP', lossless=True, method=6)

          # Cache-bust only. Routing logic remains Antler-only and unchanged.
          js_path = root / 'pet/evolution-art-fix.js'
          js = js_path.read_text()
          assert 'antler-bean.webp?v=20260928-antler-v3' in js
          js = js.replace('antler-bean.webp?v=20260928-antler-v3', 'antler-bean.webp?v=20260928-antler-v3b')
          js_path.write_text(js)

          home_path = root / 'pet/home-pet.js'
          home = home_path.read_text()
          assert 'antler-bean.webp?v=20260928-antler-v3' in home
          home = home.replace('antler-bean.webp?v=20260928-antler-v3', 'antler-bean.webp?v=20260928-antler-v3b')
          home_path.write_text(home)

          index = root / 'index.html'
          html = index.read_text()
          assert html.count('/pet/home-pet.js?v=20260928-antler-v3') == 1
          index.write_text(html.replace('/pet/home-pet.js?v=20260928-antler-v3', '/pet/home-pet.js?v=20260928-antler-v3b', 1))

          pet_index = root / 'pet/index.html'
          phtml = pet_index.read_text()
          assert phtml.count('/pet/evolution-art-fix.js?v=20260928-antler-v3') == 1
          pet_index.write_text(phtml.replace('/pet/evolution-art-fix.js?v=20260928-antler-v3', '/pet/evolution-art-fix.js?v=20260928-antler-v3b', 1))
          PY

      - name: Focused checks
        run: |
          node --check pet/evolution-art-fix.js
          node --check pet/home-pet.js
          git diff --check
          python <<'PY'
          from pathlib import Path
          from PIL import Image

          CELL=640
          sheet=Image.open('pet/art-evolution-v3/antler-bean.webp').convert('RGBA')
          assert sheet.size == (CELL*3, CELL*2), sheet.size
          bboxes=[]
          for x,y in [(0,0),(1,0),(2,0),(0,1),(1,1)]:
              cell=sheet.crop((x*CELL,y*CELL,(x+1)*CELL,(y+1)*CELL))
              bb=cell.getchannel('A').getbbox()
              assert bb is not None
              l,t,r,b=bb
              assert l>=18 and t>=18 and r<=CELL-18 and b<=CELL-18, bb
              bboxes.append(bb)
          sixth=sheet.crop((2*CELL,CELL,3*CELL,2*CELL))
          assert sixth.getchannel('A').getbbox() is None

          # Overall occupied sizes must trend upward strongly enough to read as evolution.
          areas=[(r-l)*(b-t) for l,t,r,b in bboxes]
          assert areas[1] > areas[0]*1.08, areas
          assert areas[2] > areas[1]*1.08, areas
          assert areas[3] > areas[2]*1.05, areas
          assert areas[4] > areas[3]*1.03, areas

          js=Path('pet/evolution-art-fix.js').read_text()
          home=Path('pet/home-pet.js').read_text()
          assert 'antler-bean.webp?v=20260928-antler-v3b' in js
          assert 'antler-bean.webp?v=20260928-antler-v3b' in home
          assert 'moss-hornling.avif?v=20260928-moss-v3' in js
          assert 'pebble-wisp.avif' in js
          print('Antler Bean clean rebuild checks passed', areas)
          PY
          test "$(git hash-object pet/art-evolution-v3/moss-hornling.avif)" = "dec813e40ea6c5976f8a9bad107a4a9b1923413b"
          test "$(git hash-object pet/art-evolution-v3/pebble-wisp.avif)" = "221ce9e4ac718bcb7a869a0056dae92f59f16c15"
          echo '--- exact changed files before push ---'
          git status --short

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git add pet/art-evolution-v3/antler-bean.webp pet/evolution-art-fix.js pet/home-pet.js index.html pet/index.html
          git rm -f .github/workflows/antler-bean-v3-cleanup.yml
          git diff --cached --check
          git status --short
          git commit -m "Clean Antler Bean evolution sprite sheet"
          git push
