name: Academic QA - food tests and numeric marking

on:
  push:
    paths:
      - 'content/topics/bio-y8-food-tests.json'
      - 'content/topics/bio-y8-energy-bmi.json'
      - 'content/topics/chem-y8-energy-changes.json'
      - 'assets/math-study/math-y9-indices.json'
      - 'assets/quiz-session-rWAnuDVj.js'
      - 'tests/academic-qa-food-numeric-20261122.test.mjs'
      - 'tests/academic-qa-food-52-markpoints-20261122.test.mjs'
      - 'tests/academic-qa-food-46-adversarial-20261122.test.mjs'
      - 'qa-staging/food-tests-46-markpoint-evidence-draft-20261122.json'
      - '.github/workflows/academic-qa-food-numeric-20261122.yml'
  pull_request:
    paths:
      - 'content/topics/bio-y8-food-tests.json'
      - 'content/topics/bio-y8-energy-bmi.json'
      - 'content/topics/chem-y8-energy-changes.json'
      - 'assets/math-study/math-y9-indices.json'
      - 'assets/quiz-session-rWAnuDVj.js'
      - 'tests/academic-qa-food-numeric-20261122.test.mjs'
      - 'tests/academic-qa-food-52-markpoints-20261122.test.mjs'
      - 'tests/academic-qa-food-46-adversarial-20261122.test.mjs'
      - 'qa-staging/food-tests-46-markpoint-evidence-draft-20261122.json'
      - '.github/workflows/academic-qa-food-numeric-20261122.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Academic content and marking regression
        run: node tests/academic-qa-food-numeric-20261122.test.mjs
      - name: Food Tests 52-markpoint fairness and adversarial QA
        run: node --test tests/academic-qa-food-52-markpoints-20261122.test.mjs
      - name: Food Tests 46 remaining answers - 86 equivalent and denial checks + 598 science-trap cases
        run: node --test tests/academic-qa-food-46-adversarial-20261122.test.mjs
