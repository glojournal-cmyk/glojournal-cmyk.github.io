name: Finish Pebble Wisp v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pebble-wisp-v3-finish.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Assemble approved AVIF and integrate sprite
        run: |
          python <<'PY'
          from pathlib import Path
          import base64, hashlib

          root = Path('.')
          transport = root / 'pet/generated-art/pebble-wisp-v3'
          p1 = (transport / 'part-01.txt').read_text().strip()
          assert len(p1) == 9999
          p1 = p1[:9849] + 'n' + p1[9849:]
          parts = [
              p1,
              (transport / 'part-02.txt').read_text().strip(),
              (transport / 'part-03.txt').read_text().strip(),
              (transport / 'part-04.txt').read_text().strip(),
              (transport / 'part-05.txt').read_text().strip(),
              (transport / 'part-06.txt').read_text().strip(),
              (transport / 'part-07a.txt').read_text().strip(),
              *((transport / f'part-07b{i}.txt').read_text().strip() for i in range(1, 6)),
              (transport / 'part-08.txt').read_text().strip(),
          ]
          payload = ''.join(parts)
          assert len(payload) == 77988, len(payload)
          data = base64.b64decode(payload, validate=True)
          assert len(data) == 58491, len(data)
          assert hashlib.sha256(data).hexdigest() == 'f7d867e7ca7f39de35b7b405d973a981509ac240eddb4dd2e70878fb9432d600'
          assert data[4:12] == b'ftypavif'
          out = root / 'pet/art-evolution-v3/pebble-wisp.avif'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(data)

          js_path = root / 'pet/evolution-art-fix.js'
          js = js_path.read_text()
          old_head = 'const EVOLUTION_ART_VERSION = "20260927-evolution3";\nconst LEGACY_SPRITE_RE = /\\/pet\\/art-evolution-v2\\/([a-z0-9-]+)\\.webp/i;'
          new_head = '''const EVOLUTION_ART_VERSION = "20260927-pebble-v3";\nconst PEBBLE_SHEET = `/pet/art-evolution-v3/pebble-wisp.avif?v=${EVOLUTION_ART_VERSION}`;\nconst PEBBLE_SOURCE_RE = /\\/pet\\/(?:art-master\\/pebble-wisp\\.png|art-evolution-v2\\/pebble-wisp\\.webp)/i;\nconst LEGACY_SPRITE_RE = /\\/pet\\/art-evolution-v2\\/([a-z0-9-]+)\\.webp/i;'''
          assert old_head in js
          js = js.replace(old_head, new_head, 1)
          needle = 'function patchSprite(el) {'
          insert = '''function pebblePosition(level) {\n  return {\n    1: "0% 0%",\n    2: "50% 0%",\n    3: "100% 0%",\n    4: "0% 100%",\n    5: "50% 100%",\n  }[clampLevel(level)];\n}\n\nfunction patchPebble(el, background) {\n  if (!PEBBLE_SOURCE_RE.test(background)) return false;\n  const level = inferLevel(el);\n  el.style.backgroundImage = `url("${PEBBLE_SHEET}")`;\n  el.style.backgroundSize = "300% 200%";\n  el.style.backgroundPosition = pebblePosition(level);\n  el.style.backgroundRepeat = "no-repeat";\n  el.dataset.evolutionArt = `pebble-wisp:${level}:v3`;\n  return true;\n}\n\n'''
          assert needle in js and 'function patchPebble(' not in js
          js = js.replace(needle, insert + needle, 1)
          needle2 = '  const background = el.style.backgroundImage || "";\n  const match = background.match(LEGACY_SPRITE_RE);'
          replace2 = '  const background = el.style.backgroundImage || "";\n  if (patchPebble(el, background)) return true;\n  const match = background.match(LEGACY_SPRITE_RE);'
          assert needle2 in js
          js = js.replace(needle2, replace2, 1)
          js_path.write_text(js)

          css_path = root / 'pet/home-companion-v2.css'
          css = css_path.read_text()
          marker = '/* Pebble Wisp v3 · approved five-form evolution sheet.'
          assert marker not in css
          css += '''\n\n/* Pebble Wisp v3 · approved five-form evolution sheet.\n   The inline style still identifies the selected species; these rules only\n   replace Pebble Wisp art and leave every other companion untouched. */\n#mastery-pet-home .mph-art[style*="pebble-wisp"] {\n  background-image: url('/pet/art-evolution-v3/pebble-wisp.avif?v=20260927-pebble-v3') !important;\n  background-size: 300% 200% !important;\n  background-repeat: no-repeat !important;\n}\n#mastery-pet-home[data-stage="1"] .mph-art[style*="pebble-wisp"] { background-position: 0% 0% !important; }\n#mastery-pet-home[data-stage="2"] .mph-art[style*="pebble-wisp"] { background-position: 50% 0% !important; }\n#mastery-pet-home[data-stage="3"] .mph-art[style*="pebble-wisp"] { background-position: 100% 0% !important; }\n#mastery-pet-home[data-stage="4"] .mph-art[style*="pebble-wisp"] { background-position: 0% 100% !important; }\n#mastery-pet-home[data-stage="5"] .mph-art[style*="pebble-wisp"] { background-position: 50% 100% !important; }\n'''
          css_path.write_text(css)
          PY

      - name: Run focused checks
        run: |
          node --check pet/evolution-art-fix.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('pet/art-evolution-v3/pebble-wisp.avif')
          assert p.stat().st_size == 58491
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'f7d867e7ca7f39de35b7b405d973a981509ac240eddb4dd2e70878fb9432d600'
          js = Path('pet/evolution-art-fix.js').read_text()
          css = Path('pet/home-companion-v2.css').read_text()
          for pos in ('0% 0%', '50% 0%', '100% 0%', '0% 100%', '50% 100%'):
              assert pos in js and pos in css
          assert '300% 200%' in js and '300% 200%' in css
          assert 'PEBBLE_SOURCE_RE' in js and 'patchPebble' in js
          assert '#mastery-pet-home[data-stage="5"]' in css
          print('Pebble Wisp v3 focused checks passed')
          PY

      - name: Commit final files and remove transport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git add pet/art-evolution-v3/pebble-wisp.avif pet/evolution-art-fix.js pet/home-companion-v2.css
          git rm -f \
            pet/generated-art/pebble-wisp-v3/part-05.txt \
            pet/generated-art/pebble-wisp-v3/part-06.txt \
            pet/generated-art/pebble-wisp-v3/part-07a.txt \
            pet/generated-art/pebble-wisp-v3/part-07b1.txt \
            pet/generated-art/pebble-wisp-v3/part-07b2.txt \
            pet/generated-art/pebble-wisp-v3/part-07b3.txt \
            pet/generated-art/pebble-wisp-v3/part-07b4.txt \
            pet/generated-art/pebble-wisp-v3/part-07b5.txt \
            pet/generated-art/pebble-wisp-v3/part-08.txt \
            .github/workflows/pebble-wisp-v3-finish.yml
          git status --short
          git diff --cached --check
          git commit -m "Use approved Pebble Wisp five-stage evolution art"
          git push
