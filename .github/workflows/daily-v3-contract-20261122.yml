name: Daily Tasks V3 contract and safety gates
on:
  push:
    branches: [feature/daily-tasks-v3-20261122]
    paths:
      - 'assets/daily-tasks-v3-20261122.js'
      - 'assets/daily-vocab-20261003.js'
      - 'assets/index-BLVOhKhN.js'
      - 'tests/daily-v3-contract-20261122.test.mjs'
      - 'assets/daily-v3-approved-content-20261122.js'
      - 'tests/daily-v3-academic-approved-20261122.test.mjs'
      - 'tests/daily-v3-scoring-integrity-20261122.test.mjs'
      - 'tests/daily-v3-vocab-20261122.test.mjs'
      - 'tests/daily-20261103-inflight-and-window.test.mjs'
      - 'scripts/daily-v3-bank-audit-20261122.mjs'
      - '.github/workflows/daily-v3-contract-20261122.yml'
  pull_request:
    paths:
      - 'assets/daily-tasks-v3-20261122.js'
      - 'assets/daily-vocab-20261003.js'
      - 'assets/index-BLVOhKhN.js'
      - 'tests/daily-v3-contract-20261122.test.mjs'
      - 'assets/daily-v3-approved-content-20261122.js'
      - 'tests/daily-v3-academic-approved-20261122.test.mjs'
      - 'tests/daily-v3-scoring-integrity-20261122.test.mjs'
      - 'tests/daily-v3-vocab-20261122.test.mjs'
      - 'tests/daily-20261103-inflight-and-window.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v3-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and integrity
        run: |
          node --check assets/daily-tasks-v3-20261122.js
          node --check assets/daily-vocab-20261003.js
          node --check assets/index-BLVOhKhN.js
          node --check assets/daily-v3-approved-content-20261122.js
          node --check tests/daily-v3-academic-approved-20261122.test.mjs
          node --check tests/daily-v3-scoring-integrity-20261122.test.mjs
          node --check tests/daily-v3-contract-20261122.test.mjs
          node --check tests/daily-v3-vocab-20261122.test.mjs
      - name: Unit tests - Daily V3 contract
        run: node --test tests/daily-v3-contract-20261122.test.mjs tests/daily-v3-vocab-20261122.test.mjs tests/daily-v3-academic-approved-20261122.test.mjs tests/daily-v3-scoring-integrity-20261122.test.mjs
      - name: Existing Daily V2, vocabulary, Recovery and concept supply regression
        run: |
          node --test tests/daily-vocab-year9-three-20261021.test.mjs tests/daily-20261103-inflight-and-window.test.mjs tests/question-supply-preflight-20261111.test.mjs tests/recovery-all-tasks-ledger.test.mjs
      - name: Read-only Year 8/9 concept supply inventory
        run: node scripts/daily-v3-bank-audit-20261122.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-v3-source-inventory
          path: test-results/daily-v3-bank-audit-20261122.json
          retention-days: 14
