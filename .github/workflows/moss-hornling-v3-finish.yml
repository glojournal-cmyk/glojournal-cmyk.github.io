name: Finish Moss Hornling v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/moss-hornling-v3-finish.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Integrate approved Moss Hornling art
        run: |
          python <<'PY'
          from pathlib import Path
          import hashlib

          sprite = Path('pet/art-evolution-v3/moss-hornling.webp')
          data = sprite.read_bytes()
          assert len(data) == 125638, len(data)
          assert hashlib.sha256(data).hexdigest() == 'c03b167967042bca227a312da86f0f7e05ef52450e49d17833ce1c267198c570'
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP'

          js_path = Path('pet/evolution-art-fix.js')
          js = js_path.read_text()
          assert 'MOSS_SHEET' not in js
          needle = 'const PEBBLE_SOURCE_RE = /\\/pet\\/(?:art-master\\/pebble-wisp\\.png|art-evolution-v2\\/pebble-wisp\\.webp)/i;\n'
          insert = needle + 'const MOSS_SHEET = "/pet/art-evolution-v3/moss-hornling.webp?v=20260928-moss-v3";\nconst MOSS_SOURCE_RE = /\\/pet\\/(?:art-master\\/moss-hornling\\.png|art-evolution-v2\\/moss-hornling\\.webp)/i;\n'
          assert needle in js
          js = js.replace(needle, insert, 1)
          marker = 'function pebblePosition(level) {'
          moss = '''function mossPosition(level) {\n  return {\n    1: "0% 0%",\n    2: "50% 0%",\n    3: "100% 0%",\n    4: "0% 100%",\n    5: "50% 100%",\n  }[clampLevel(level)];\n}\n\nfunction patchMoss(el, background) {\n  if (!MOSS_SOURCE_RE.test(background)) return false;\n  const level = inferLevel(el);\n  el.style.backgroundImage = `url("${MOSS_SHEET}")`;\n  el.style.backgroundSize = "300% 200%";\n  el.style.backgroundPosition = mossPosition(level);\n  el.style.backgroundRepeat = "no-repeat";\n  el.dataset.evolutionArt = `moss-hornling:${level}:v3`;\n  return true;\n}\n\n'''
          assert marker in js
          js = js.replace(marker, moss + marker, 1)
          needle2 = '  const background = el.style.backgroundImage || "";\n  if (patchPebble(el, background)) return true;'
          replace2 = '  const background = el.style.backgroundImage || "";\n  if (patchMoss(el, background)) return true;\n  if (patchPebble(el, background)) return true;'
          assert needle2 in js
          js = js.replace(needle2, replace2, 1)
          js_path.write_text(js)

          home_path = Path('pet/home-pet.js')
          home = home_path.read_text()
          old = '''function spriteStyle(species, level = 1) {\n  const safe = pets[species] ? species : "moss-hornling";\n  if (Number(level) >= 2) {\n    const position = { 2: "0% 0%", 3: "100% 0%", 4: "0% 100%", 5: "100% 100%" }[Number(level)] || "0% 0%";\n    return `background-image:url('/pet/art-evolution-v2/${safe}.webp?v=${PET_ART_VERSION}');background-size:200% 200%;background-position:${position}`;\n  }\n  return `background-image:url('/pet/art-master/${safe}.png?v=${PET_ART_VERSION}')`;\n}\n'''
          new = '''function spriteStyle(species, level = 1) {\n  const safe = pets[species] ? species : "moss-hornling";\n  const stage = Math.max(1, Math.min(5, Number(level) || 1));\n  if (safe === "moss-hornling") {\n    const position = { 1: "0% 0%", 2: "50% 0%", 3: "100% 0%", 4: "0% 100%", 5: "50% 100%" }[stage];\n    return `background-image:url('/pet/art-evolution-v3/moss-hornling.webp?v=20260928-moss-v3');background-size:300% 200%;background-position:${position}`;\n  }\n  if (stage >= 2) {\n    const position = { 2: "0% 0%", 3: "100% 0%", 4: "0% 100%", 5: "100% 100%" }[stage] || "0% 0%";\n    return `background-image:url('/pet/art-evolution-v2/${safe}.webp?v=${PET_ART_VERSION}');background-size:200% 200%;background-position:${position}`;\n  }\n  return `background-image:url('/pet/art-master/${safe}.png?v=${PET_ART_VERSION}')`;\n}\n'''
          assert old in home
          home = home.replace(old, new, 1)
          home_path.write_text(home)

          root = Path('index.html')
          root_html = root.read_text()
          old_loader = '/pet/home-pet.js?v=20260927-year8-route'
          assert root_html.count(old_loader) == 1
          root.write_text(root_html.replace(old_loader, '/pet/home-pet.js?v=20260928-moss-v3', 1))

          pet_index = Path('pet/index.html')
          pet_html = pet_index.read_text()
          old_router = '/pet/evolution-art-fix.js?v=20260927-evolution3'
          assert pet_html.count(old_router) == 1
          pet_index.write_text(pet_html.replace(old_router, '/pet/evolution-art-fix.js?v=20260928-moss-v3', 1))
          PY

      - name: Run focused checks
        run: |
          node --check pet/evolution-art-fix.js
          node --check pet/home-pet.js
          git diff --check
          grep -q 'moss-hornling.webp?v=20260928-moss-v3' pet/evolution-art-fix.js
          grep -q 'moss-hornling.webp?v=20260928-moss-v3' pet/home-pet.js
          grep -q 'home-pet.js?v=20260928-moss-v3' index.html
          grep -q 'evolution-art-fix.js?v=20260928-moss-v3' pet/index.html

      - name: Commit final Moss Hornling integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git add pet/art-evolution-v3/moss-hornling.webp pet/evolution-art-fix.js pet/home-pet.js index.html pet/index.html
          git rm -f .github/workflows/moss-hornling-v3-finish.yml
          git diff --cached --check
          git commit -m "Use approved Moss Hornling five-stage evolution art"
          git push
