name: Stage Original Generated Notes Banners
on:
  pull_request:
    paths:
      - .github/workflows/stage-gloria-notes-banners.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-image-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download original ImageGen PNGs from temporary image assets
        env:
          SOURCES_JSON: '{"latin":"https://at.adobe.com/ihT9MIZTxTAs4VPl","french":"https://at.adobe.com/j96Yb9xgGXQGXBfe","english":"https://at.adobe.com/BwNKyP8Be6I9p0pv","maths":"https://at.adobe.com/ZmaOFOTC2pKasCkc","biology":"https://at.adobe.com/psEQJNQSe22AUbjl","chemistry":"https://at.adobe.com/T4XuRMB7BXYlUVJK","physics":"https://at.adobe.com/Zt8zTxov2M8aBdqw"}'
        run: |
          set -euo pipefail
          mkdir -p original-pngs
          python3 - <<'PY' > /tmp/images.list
          import os,json
          for subject,url in json.loads(os.environ['SOURCES_JSON']).items():
            print(subject+" "+url)
          PY
          while read -r subject src; do
            echo "FETCH_GENERATED_BANNER $subject"
            curl -fL --retry 2 --retry-delay 2 --connect-timeout 12 --max-time 70 -sS "$src" -o "original-pngs/$subject.png"
          done < /tmp/images.list
      - name: Ensure downloads are actual high-resolution PNG image bytes
        run: |
          python3 - <<'PY'
          import struct,pathlib
          files=sorted(pathlib.Path('original-pngs').glob('*.png'))
          assert len(files)==7,'Expected 7 generated image assets'
          for path in files:
            with path.open('rb') as f: header=f.read(33)
            assert header[:8]==b'\x89PNG\r\n\x1a\n',f'{path} not a PNG'
            width,height=struct.unpack('>II',header[16:24])
            assert width>=1000 and height>=400, f'{path} is low resolution {width}x{height}'
            print('GENERATED_IMAGE_OK',path.name,width,height,path.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gloria-generated-banners-seven
          path: original-pngs
