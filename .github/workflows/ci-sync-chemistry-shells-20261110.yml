name: Temporary Chemistry Recovery route-shell sync
on:
  push:
    branches: [fix/year8-chemistry-recovery-shortage-20261110]
    paths:
      - '.github/workflows/ci-sync-chemistry-shells-20261110.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/year8-chemistry-recovery-shortage-20261110
          persist-credentials: true
      - name: Synchronize all production route shells to single app module URL
        run: python3 scripts/sync-route-shells.py
      - name: Verify canonical app store and 404 safety
        run: |
          node --test tests/canonical-entrypoint-20261026.test.mjs
          node tests/route-shell-qa.mjs
      - name: Commit only synchronized tracked route shells to this PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize all production route shells for Chemistry Recovery JS cache"
            git push origin HEAD:fix/year8-chemistry-recovery-shortage-20261110
          fi
