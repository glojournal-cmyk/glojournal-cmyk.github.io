name: iPad Daily spacious keyboard preview QA
on:
  pull_request:
    paths:
      - "assets/daily-practice-ux-v2-20261020.css"
      - "assets/ipad-experience-20261004.js"
      - "tests/ipad-spacious-keyboard-20261020.mjs"
      - ".github/workflows/ipad-spacious-keyboard-20261020.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check assets/ipad-experience-20261004.js
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium webkit
      - name: Check large prompt, manual scrolling, stable Submit and keyboard toggling
        run: node tests/ipad-spacious-keyboard-20261020.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-spacious-layout-screenshots
          path: test-results/ipad-spacious-keyboard-20261020/*.png
