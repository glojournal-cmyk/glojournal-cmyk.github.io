name: Daily V3 real-app iPad WebKit/Chromium QA
on:
  push:
    branches: [feature/daily-tasks-v3-20261122]
    paths:
      - '.github/workflows/daily-v3-ipad-browser-20261122.yml'
      - 'tests/daily-v3-ipad-browser-20261122.mjs'
      - 'assets/daily-tasks-v3-20261122.js'
      - 'assets/daily-v3-approved-content-20261122.js'
      - 'assets/study._subject.practise-D_PWgUd7.js'
      - 'assets/index-BLVOhKhN.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipad-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Test V3 on isolated app with iPad Chromium and WebKit emulation
        run: node tests/daily-v3-ipad-browser-20261122.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-v3-ipad-browser-evidence
          path: test-results/daily-v3-ipad/
          retention-days: 14
