name: Latin and French Daily Vocabulary 27 + 3 QA
on:
  push:
    paths:
      - "assets/daily-vocab-20261003.js"
      - "assets/daily-vocab-y9-20261021.js"
      - "assets/study._subject.practise-D_PWgUd7.js"
      - "assets/year8-daily-v2-20261018.js"
      - "tests/daily-vocab-only-qa.mjs"
      - "tests/daily-vocab-year9-three-20261021.test.mjs"
      - ".github/workflows/daily-vocab-year9-three-20261021.yml"
  pull_request:
    paths:
      - "assets/daily-vocab-20261003.js"
      - "assets/daily-vocab-y9-20261021.js"
      - "assets/study._subject.practise-D_PWgUd7.js"
      - "tests/daily-vocab-only-qa.mjs"
      - "tests/daily-vocab-year9-three-20261021.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-vocab:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify 27 Year 7–8 + 3 Year 9, smart random and no sentences
        run: node --test tests/daily-vocab-year9-three-20261021.test.mjs tests/daily-vocab-total-20261020.test.mjs
      - name: Verify original vocabulary and review selection compatibility
        run: node tests/daily-vocab-only-qa.mjs
      - name: Syntax check updated practice bundle
        run: node --check assets/study._subject.practise-D_PWgUd7.js
