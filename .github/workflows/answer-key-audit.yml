name: answer-key audit
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit every question answer key
        env:
          STRICT: "1"
        run: node tests/answer-key-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: answer-key-audit
          path: test-results/answer-key-audit.json
