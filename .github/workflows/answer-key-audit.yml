name: answer-key audit
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check production runtime syntax
        run: |
          node --check assets/index-BLVOhKhN.core.js
          node --check assets/index-BLVOhKhN.js
          node --check assets/study._subject.practise-D_PWgUd7.js
          node --check assets/quiz-session-rWAnuDVj.js
          node --check assets/study._subject.progress-DkPgutuL.js
          node --check assets/play._game-BbpxhxeZ.js
          node --check assets/scholar-iJ2ilQWG.js
      - name: Test French practice regressions
        run: node --test tests/french-practice-regression.mjs
      - name: Audit production route shells
        run: node tests/route-shell-qa.mjs
      - name: Audit progress backup schema
        run: node tests/backup-schema-qa.mjs
      - name: Audit daily task persistence
        run: node tests/daily-task-persistence-qa.mjs
      - name: Audit daily vocab gates
        run: node tests/daily-vocab-gate-qa.mjs
      - name: Audit daily plan rigor
        run: node tests/daily-plan-rigor-qa.mjs
      - name: Audit mastery rewards
        run: node tests/mastery-reward-qa.mjs
      - name: Audit game progression
        run: node tests/game-progression-qa.mjs
      - name: Audit vocab bank and dictation
        run: node tests/vocab-bank-dictation-qa.mjs
      - name: Audit repair score fairness
        run: node tests/repair-score-qa.mjs
      - name: Test French session diversity
        run: node tests/french-session-diversity.mjs
      - name: Audit French content quality
        run: node tests/french-content-quality-audit.mjs
      - name: Test Latin session diversity
        run: node tests/latin-session-diversity.mjs
      - name: Audit Latin content quality
        run: node tests/latin-content-quality-audit.mjs
      - name: Smoke-test live French and Latin practice
        run: node tests/live-practice-smoke.mjs
      - name: Test marking interactions
        run: node tests/marking-interaction-qa.mjs
      - name: Test repair and review progress
        run: node tests/progress-repair-qa.mjs
      - name: Audit Physics content quality
        run: node tests/physics-content-quality-audit.mjs
      - name: Test Physics calculation marking
        run: node tests/physics-calculation-marking-qa.mjs
      - name: Audit Physics session quality
        run: node tests/physics-session-quality.mjs
      - name: Audit Chemistry content quality
        run: node tests/chemistry-content-quality-audit.mjs
      - name: Test Chemistry calculation marking
        run: node tests/chemistry-calculation-marking-qa.mjs
      - name: Test Chemistry notation marking
        run: node tests/chemistry-notation-qa.mjs
      - name: Audit Chemistry session quality
        run: node tests/chemistry-session-quality.mjs
      - name: Audit Biology content quality
        run: node tests/biology-content-quality-audit.mjs
      - name: Test Biology calculation marking
        run: node tests/biology-calculation-marking-qa.mjs
      - name: Audit Biology session quality
        run: node tests/biology-session-quality.mjs
      - name: Audit every question answer key
        env:
          STRICT: "1"
        run: node tests/answer-key-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: answer-key-audit
          path: |
            test-results/answer-key-audit.json
            test-results/french-content-quality.json
            test-results/latin-content-quality.json
            test-results/live-practice-smoke.json
            test-results/marking-interaction-qa.json
            test-results/progress-repair-qa.json
            test-results/physics-content-quality.json
            test-results/physics-calculation-marking.json
            test-results/physics-session-quality.json
            test-results/chemistry-content-quality.json
            test-results/chemistry-calculation-marking.json
            test-results/chemistry-notation-qa.json
            test-results/chemistry-session-quality.json
            test-results/biology-content-quality.json
            test-results/biology-calculation-marking.json
            test-results/biology-session-quality.json
            test-results/route-shell-qa.json
            test-results/backup-schema-qa.json
            test-results/daily-task-persistence-qa.json
            test-results/repair-score-qa.json
            test-results/daily-vocab-gate-qa.json
            test-results/daily-plan-rigor-qa.json
            test-results/mastery-reward-qa.json
            test-results/game-progression-qa.json
            test-results/vocab-bank-dictation-qa.json
