name: Daily tasks and progress reliability
on:
  push:
    branches: [main]
    paths:
      - 'assets/index-BLVOhKhN.js'
      - 'assets/progress-preflight-20261007.js'
      - 'assets/daily-progress-save.js'
      - 'assets/journey-navigation-20261004.js'
      - 'assets/practice-drafts-20261004.js'
      - 'tests/daily-progress-reliability.cjs'
      - '.github/workflows/daily-progress-qa.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'assets/index-BLVOhKhN.js'
      - 'assets/progress-preflight-20261007.js'
      - 'assets/daily-progress-save.js'
      - 'assets/journey-navigation-20261004.js'
      - 'assets/practice-drafts-20261004.js'
      - 'tests/daily-progress-reliability.cjs'
      - '.github/workflows/daily-progress-qa.yml'
permissions:
  contents: read
jobs:
  daily-progress-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test daily task and progress reliability
        run: node --test tests/daily-progress-reliability.cjs
      - name: Test Recovery and storage safety
        run: node --test tests/recovery-quest.test.mjs tests/backup-vault.test.mjs tests/storage-quota.test.mjs tests/backup-export.test.mjs
