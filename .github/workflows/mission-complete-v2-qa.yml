name: Mission Complete V2 QA
on:
  pull_request:
    paths:
      - 'assets/mission-complete-v2-*'
      - 'assets/journey-navigation-ui-20261004.js'
      - 'assets/session-reflection-20261004.js'
      - 'assets/quiz-session-*'
      - 'assets/study._subject.practise-*'
      - 'assets/session._kind-*'
      - 'assets/index-BLVOhKhN*.js'
      - 'study/*/practise/index.html'
      - 'tests/mission-complete-v2*'
      - 'tests/phase1-ux-qa.mjs'
      - 'pet/home-pet.js'
      - 'pet/home-companion-v2.css'
      - 'pet/quest-home-reaction-20261010.js'
      - 'pet/home-personality-20261010.js'
      - 'tests/phase3-home-personality-qa.mjs'
      - 'tests/phase3-home-personality-browser.mjs'
      - 'assets/companion-experience-20261004.js'
      - 'assets/companion-experience-20261004.css'
      - 'assessment-link.js'
      - '.github/workflows/mission-complete-v2-qa.yml'
  push:
    branches: [main]
    paths:
      - 'assets/mission-complete-v2-*'
      - 'assets/journey-navigation-ui-20261004.js'
      - 'assets/session-reflection-20261004.js'
      - 'study/*/practise/index.html'
      - 'tests/mission-complete-v2*'
      - 'tests/phase1-ux-qa.mjs'
      - 'pet/home-pet.js'
      - 'pet/home-companion-v2.css'
      - 'pet/quest-home-reaction-20261010.js'
      - 'pet/home-personality-20261010.js'
      - 'tests/phase3-home-personality-qa.mjs'
      - 'tests/phase3-home-personality-browser.mjs'
      - 'assets/companion-experience-20261004.js'
      - 'assets/companion-experience-20261004.css'
      - 'assessment-link.js'
      - '.github/workflows/mission-complete-v2-qa.yml'
permissions:
  contents: read
jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JS syntax
        run: |
          node --check assets/session-reflection-20261004.js
          node --check assets/journey-navigation-ui-20261004.js
          node --check assets/mission-complete-v2-core-20261010.js
          node --check assets/quiz-session-y8fix-20260920.js
          node --check assets/quiz-session-rWAnuDVj.js
          node --check pet/home-pet.js
          node --check pet/quest-home-reaction-20261010.js
          node --check pet/home-personality-20261010.js
          node --check assets/companion-experience-20261004.js
      - name: Verify persisted credit, XP and links
        run: |
          node --test tests/mission-complete-v2.cjs
          node tests/phase1-ux-qa.mjs
          node tests/phase3-home-personality-qa.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify Practice + Home + Mission V2 in browsers
        run: |
          node tests/mission-complete-v2-browser.mjs
          node tests/phase3-home-personality-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission-complete-v2-browser-evidence
          path: test-results/mission-*.png
