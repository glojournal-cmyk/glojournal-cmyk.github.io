name: Scholar Native Plain JSON Import QA
on:
  pull_request:
    paths:
      - 'assets/scholar-iJ2ilQWG.js'
      - 'assets/index-BLVOhKhN.core.js'
      - 'assets/index-BLVOhKhN.js'
      - 'encrypted-backup-restore.html'
      - '404.html'
      - 'tests/scholar-native-plain-import-20261023.test.mjs'
      - '.github/workflows/scholar-native-plain-import-20261023.yml'
  workflow_dispatch:
jobs:
  normal-json-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/scholar-iJ2ilQWG.js
      - run: node --check assets/index-BLVOhKhN.core.js
      - run: node --check assets/index-BLVOhKhN.js
      - run: node --test tests/scholar-native-plain-import-20261023.test.mjs
      - run: node --test tests/scholar-plain-import-entry-20261023.test.mjs tests/backup-import-legacy-ipad-20261023.test.mjs tests/full-progress-backup-guard-20261023.test.mjs
