name: Practice store cache alignment QA
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify every Study Practice entrypoint uses Home canonical store
        run: node --test tests/practice-cache-alignment-20261026.mjs
