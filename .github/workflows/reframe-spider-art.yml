name: Reframe Spider Art Safely
on:
  push:
    branches: ['feature/pet-level10']
    paths:
      - 'tests/reframe-night-spider.py'
      - '.github/workflows/reframe-spider-art.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reframe:
    if: github.ref == 'refs/heads/feature/pet-level10'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Pad near-edge spider artwork and verify all forms
        run: python tests/reframe-night-spider.py
      - name: Commit only corrected imagery and manifest
        shell: bash
        run: |
          if ! git diff --quiet -- pet/art-level10-20261012; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pet/art-level10-20261012
            git commit -m 'Reframe Night Spider stages with transparent safe margins'
            git push
          else
            echo 'No image changes needed.'
          fi
