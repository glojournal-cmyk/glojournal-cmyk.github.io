name: Upload Two Year 9 Illustrated PDF Notes to R2
on:
  pull_request:
    paths:
      - notes/catalog.json
      - .github/scripts/upload_year9_image_notes.py
      - .github/workflows/upload-year9-image-notes.yml
  push:
    branches: [main]
    paths:
      - notes/catalog.json
      - .github/scripts/upload_year9_image_notes.py
      - .github/workflows/upload-year9-image-notes.yml
permissions:
  contents: read
concurrency:
  group: gloria-notes-year9-r2-upload
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF verifier
        run: python3 -m pip install --quiet pypdf
      - name: Validate original source PDFs and exact catalog entries (no writes)
        run: python3 .github/scripts/upload_year9_image_notes.py --dry-run
      - name: Upload only approved image-note PDFs and verify live public reader
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/scripts/upload_year9_image_notes.py --upload
