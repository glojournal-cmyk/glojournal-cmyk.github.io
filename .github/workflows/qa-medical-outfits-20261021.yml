name: Medical Outfits iPad Visual QA
on:
  push:
    paths:
      - qa/medical-outfits-smoke.mjs
      - .github/workflows/qa-medical-outfits-20261021.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Playwright
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install Chromium and WebKit for iPad checks
        run: npx playwright install --with-deps chromium webkit
      - name: Serve unmodified production static site
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 > /tmp/scholar-medical-http.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          curl -fIsS http://127.0.0.1:8787/scholar/ | head -n 5
      - name: Run Medical Career Mastery and visual scenarios
        id: medicalqa
        continue-on-error: true
        run: node qa/medical-outfits-smoke.mjs
      - name: Attach QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medical-outfits-ipad-qa
          path: qa-artifacts/
          if-no-files-found: ignore
      - name: Save QA outcome for inspection
        if: always()
        env:
          QA_OUTCOME: ${{ steps.medicalqa.outcome }}
          QA_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os,json,datetime,pathlib
          path=pathlib.Path("qa-artifacts/medical-outfits-qa.json")
          data=json.loads(path.read_text()) if path.exists() else []
          obj={"outcome":os.environ.get("QA_OUTCOME","unknown"),"run":os.environ.get("QA_RUN_URL"),"date":datetime.datetime.now(datetime.timezone.utc).isoformat(),"scenarios":data}
          pathlib.Path("qa/medical-outfits-latest.json").write_text(json.dumps(obj,indent=2)+"\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/medical-outfits-latest.json
          git commit -m "Record Medical outfit cross-browser QA status"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Enforce QA result
        if: always()
        env:
          QA_OUTCOME: ${{ steps.medicalqa.outcome }}
        run: test "$QA_OUTCOME" = "success"
