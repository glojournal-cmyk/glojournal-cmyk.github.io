name: Commit User-Selected Generated Notes Pictures
on:
  pull_request:
    paths: [.github/workflows/commit-generated-notes-pictures.yml]
  push:
    branches: [feat/notes-generated-photo-banners-20261023]
    paths: [.github/workflows/commit-generated-notes-pictures.yml]
permissions:
  contents: write
jobs:
  commit-generated-png:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/notes-generated-photo-banners-20261023')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/notes-generated-photo-banners-20261023
          persist-credentials: true
      - name: Fetch seven exact image-generated illustrations
        env:
          SOURCES_JSON: '{"latin":"https://at.adobe.com/ihT9MIZTxTAs4VPl","french":"https://at.adobe.com/j96Yb9xgGXQGXBfe","english":"https://at.adobe.com/BwNKyP8Be6I9p0pv","maths":"https://at.adobe.com/ZmaOFOTC2pKasCkc","biology":"https://at.adobe.com/psEQJNQSe22AUbjl","chemistry":"https://at.adobe.com/T4XuRMB7BXYlUVJK","physics":"https://at.adobe.com/Zt8zTxov2M8aBdqw"}'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p notes/images/generated-e
          python3 - <<'PY' > /tmp/sources.list
          import json,os
          for subject,url in json.loads(os.environ['SOURCES_JSON']).items():
            print(subject, url)
          PY
          while read -r subject source; do
            curl -fSL --retry 2 --retry-delay 2 --connect-timeout 12 --max-time 65 -sS "$source" -o "notes/images/generated-e/$subject.png"
          done < /tmp/sources.list
      - name: Verify PNG signatures and originals
        shell: bash
        run: |
          python3 - <<'PY'
          import struct,pathlib
          files=sorted(pathlib.Path('notes/images/generated-e').glob('*.png'))
          assert len(files)==7
          for p in files:
            with p.open('rb') as f: head=f.read(33)
            assert head[:8]==b'\x89PNG\r\n\x1a\n',p
            width,height=struct.unpack('>II',head[16:24])
            assert (width,height)==(2172,724),(p,width,height)
            assert p.stat().st_size>=1500000, (p,p.stat().st_size)
            print('VALIDATED_GENERATED_PNG',p.name,width,height,p.stat().st_size)
          PY
      - name: Commit seven original PNGs to existing Notes app branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/images/generated-e/*.png
          git diff --cached --quiet && { echo "Original generated banners already committed"; exit 0; }
          git commit -m "Add seven user-selected ImageGen Notes Library banner PNG originals"
          git push origin HEAD:feat/notes-generated-photo-banners-20261023
          echo "ALL_7_GENERATED_IMAGES_COMMITTED"
