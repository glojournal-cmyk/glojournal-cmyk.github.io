name: Finish Antler Bean v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/antler-bean-v3-finish.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Inspect status and incoming diff first
        run: |
          echo '--- git status --short ---'
          git status --short
          echo '--- incoming commit diff ---'
          git diff --stat HEAD^..HEAD
          git diff --check HEAD^..HEAD
          test "$(git rev-parse HEAD^)" = "205f188775078af30d0b13a92824e55c1f220b0b"

      - name: Guard untouched Moss Hornling and Pebble Wisp assets
        run: |
          test "$(git hash-object pet/art-evolution-v3/moss-hornling.avif)" = "dec813e40ea6c5976f8a9bad107a4a9b1923413b"
          test "$(git hash-object pet/art-evolution-v3/pebble-wisp.avif)" = "221ce9e4ac718bcb7a869a0056dae92f59f16c15"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build Antler Bean five-stage sheet and integrate
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('.')
          master_path = root / 'pet/art-master/antler-bean.png'
          legacy_path = root / 'pet/art-evolution-v2/antler-bean.webp'
          out_path = root / 'pet/art-evolution-v3/antler-bean.webp'

          base = Image.open(master_path).convert('RGBA')
          legacy = Image.open(legacy_path).convert('RGBA')
          assert legacy.width % 2 == 0 and legacy.height % 2 == 0
          cw, ch = legacy.width // 2, legacy.height // 2
          boxes = [
              (0, 0, cw, ch),
              (cw, 0, legacy.width, ch),
              (0, ch, cw, legacy.height),
              (cw, ch, legacy.width, legacy.height),
          ]
          stages = [base]
          for box in boxes:
              stage = legacy.crop(box)
              if stage.size != base.size:
                  stage = stage.resize(base.size, Image.Resampling.LANCZOS)
              stages.append(stage)

          sheet = Image.new('RGBA', (base.width * 3, base.height * 2), (0, 0, 0, 0))
          slots = [(0, 0), (1, 0), (2, 0), (0, 1), (1, 1)]
          for stage, (x, y) in zip(stages, slots):
              sheet.alpha_composite(stage, (x * base.width, y * base.height))
          out_path.parent.mkdir(parents=True, exist_ok=True)
          sheet.save(out_path, 'WEBP', lossless=True, method=6)

          js_path = root / 'pet/evolution-art-fix.js'
          js = js_path.read_text()
          assert 'ANTLER_SHEET' not in js
          needle = 'const MOSS_SOURCE_RE = /\\/pet\\/(?:art-master\\/moss-hornling\\.png|art-evolution-v2\\/moss-hornling\\.webp)/i;\n'
          insert = needle + 'const ANTLER_SHEET = "/pet/art-evolution-v3/antler-bean.webp?v=20260928-antler-v3";\nconst ANTLER_SOURCE_RE = /\\/pet\\/(?:art-master\\/antler-bean\\.png|art-evolution-v2\\/antler-bean\\.webp)/i;\n'
          assert needle in js
          js = js.replace(needle, insert, 1)

          marker = 'function pebblePosition(level) {'
          antler = '''function antlerPosition(level) {\n  return {\n    1: "0% 0%",\n    2: "50% 0%",\n    3: "100% 0%",\n    4: "0% 100%",\n    5: "50% 100%",\n  }[clampLevel(level)];\n}\n\nfunction patchAntler(el, background) {\n  if (!ANTLER_SOURCE_RE.test(background)) return false;\n  const level = inferLevel(el);\n  el.style.backgroundImage = `url("${ANTLER_SHEET}")`;\n  el.style.backgroundSize = "300% 200%";\n  el.style.backgroundPosition = antlerPosition(level);\n  el.style.backgroundRepeat = "no-repeat";\n  el.dataset.evolutionArt = `antler-bean:${level}:v3`;\n  return true;\n}\n\n'''
          assert marker in js
          js = js.replace(marker, antler + marker, 1)

          needle2 = '  const background = el.style.backgroundImage || "";\n  if (patchMoss(el, background)) return true;\n  if (patchPebble(el, background)) return true;'
          replacement2 = '  const background = el.style.backgroundImage || "";\n  if (patchAntler(el, background)) return true;\n  if (patchMoss(el, background)) return true;\n  if (patchPebble(el, background)) return true;'
          assert needle2 in js
          js = js.replace(needle2, replacement2, 1)
          js_path.write_text(js)

          home_path = root / 'pet/home-pet.js'
          home = home_path.read_text()
          needle3 = '''  if (stage >= 2) {\n    const position = { 2: "0% 0%", 3: "100% 0%", 4: "0% 100%", 5: "100% 100%" }[stage] || "0% 0%";\n'''
          antler_home = '''  if (safe === "antler-bean") {\n    const position = { 1: "0% 0%", 2: "50% 0%", 3: "100% 0%", 4: "0% 100%", 5: "50% 100%" }[stage];\n    return `background-image:url('/pet/art-evolution-v3/antler-bean.webp?v=20260928-antler-v3');background-size:300% 200%;background-position:${position};background-repeat:no-repeat`;\n  }\n'''
          assert needle3 in home
          home = home.replace(needle3, antler_home + needle3, 1)
          home_path.write_text(home)

          root_index = root / 'index.html'
          root_html = root_index.read_text()
          old_loader = '/pet/home-pet.js?v=20260928-moss-v3'
          assert root_html.count(old_loader) == 1
          root_index.write_text(root_html.replace(old_loader, '/pet/home-pet.js?v=20260928-antler-v3', 1))

          pet_index = root / 'pet/index.html'
          pet_html = pet_index.read_text()
          old_router = '/pet/evolution-art-fix.js?v=20260928-moss-v3'
          assert pet_html.count(old_router) == 1
          pet_index.write_text(pet_html.replace(old_router, '/pet/evolution-art-fix.js?v=20260928-antler-v3', 1))
          PY

      - name: Run focused checks
        run: |
          node --check pet/evolution-art-fix.js
          node --check pet/home-pet.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          base = Image.open('pet/art-master/antler-bean.png').convert('RGBA')
          sheet = Image.open('pet/art-evolution-v3/antler-bean.webp').convert('RGBA')
          assert sheet.size == (base.width * 3, base.height * 2), sheet.size
          w, h = base.size
          cells = [
              sheet.crop((0, 0, w, h)),
              sheet.crop((w, 0, 2*w, h)),
              sheet.crop((2*w, 0, 3*w, h)),
              sheet.crop((0, h, w, 2*h)),
              sheet.crop((w, h, 2*w, 2*h)),
              sheet.crop((2*w, h, 3*w, 2*h)),
          ]
          for i, cell in enumerate(cells[:5], 1):
              assert cell.getbbox() is not None, f'blank Antler stage {i}'
          assert cells[5].getbbox() is None, 'sixth sprite cell must remain transparent'

          js = Path('pet/evolution-art-fix.js').read_text()
          home = Path('pet/home-pet.js').read_text()
          assert 'const ANTLER_SHEET = "/pet/art-evolution-v3/antler-bean.webp?v=20260928-antler-v3";' in js
          assert 'patchAntler' in js and 'antler-bean:${level}:v3' in js
          for pos in ('0% 0%', '50% 0%', '100% 0%', '0% 100%', '50% 100%'):
              assert pos in js and pos in home
          assert "antler-bean.webp?v=20260928-antler-v3" in home
          assert '/pet/home-pet.js?v=20260928-antler-v3' in Path('index.html').read_text()
          assert '/pet/evolution-art-fix.js?v=20260928-antler-v3' in Path('pet/index.html').read_text()

          # Existing v3 routes must remain intact.
          assert 'const MOSS_SHEET = "/pet/art-evolution-v3/moss-hornling.avif?v=20260928-moss-v3";' in js
          assert 'const PEBBLE_SHEET = `/pet/art-evolution-v3/pebble-wisp.avif?v=${EVOLUTION_ART_VERSION}`;' in js
          assert "moss-hornling.avif?v=20260928-moss-v3" in home
          print('Antler Bean v3 focused checks passed')
          PY
          test "$(git hash-object pet/art-evolution-v3/moss-hornling.avif)" = "dec813e40ea6c5976f8a9bad107a4a9b1923413b"
          test "$(git hash-object pet/art-evolution-v3/pebble-wisp.avif)" = "221ce9e4ac718bcb7a869a0056dae92f59f16c15"
          printf '%s\n' '--- focused changed files before final commit ---'
          git status --short
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html pet/evolution-art-fix.js pet/home-pet.js pet/index.html "
          test -f pet/art-evolution-v3/antler-bean.webp

      - name: Commit final Antler Bean integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git add pet/art-evolution-v3/antler-bean.webp pet/evolution-art-fix.js pet/home-pet.js index.html pet/index.html
          git rm -f .github/workflows/antler-bean-v3-finish.yml
          git diff --cached --check
          echo '--- staged files ---'
          git status --short
          git commit -m "Use Antler Bean five-stage evolution art"
          git push
