name: Daily V2 isolated tests
on:
  push:
    branches:
      - feature/daily-v2-clean-rebuild-20261026
      - feature/daily-v2-mainline-staging-20261031
    paths:
      - "daily-v2/**"
      - "content/topics/**"
      - "content/catalog.json"
      - ".github/workflows/daily-v2-tests.yml"
  pull_request:
    paths:
      - "daily-v2/**"
      - "content/topics/**"
      - "content/catalog.json"
      - ".github/workflows/daily-v2-tests.yml"
permissions:
  contents: read
jobs:
  daily-v2-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run isolated Daily V2 tests
        run: node --test daily-v2/tests/*.test.js
      - name: Print actual-source capacity acceptance report (read only)
        run: node daily-v2/scripts/qa-real-capacity.mjs
      - name: Prepare isolated iPad Safari WebKit runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit
      - name: Check V2 atomic IndexedDB in isolated WebKit (no real pupil data)
        run: node daily-v2/tests/webkit-indexeddb-smoke.mjs
      - name: Exercise isolated Daily V2 staging interface in WebKit (synthetic only)
        run: node daily-v2/tests/webkit-staging-ui-smoke.mjs
      - name: Audit objective scorer against checked-in school questions (read only)
        run: node daily-v2/scripts/qa-objective-scorer.mjs
      - name: Generate independent human review worksheets (pending, no approvals)
        run: node daily-v2/scripts/build-objective-review-queue.mjs --out "$RUNNER_TEMP/daily-v2-review"
      - name: Generate Year 7-8 Latin/French vocabulary reviewer queue (pending, no approvals)
        run: node daily-v2/scripts/build-vocab-review-queue.mjs --out "$RUNNER_TEMP/daily-v2-review"
      - name: Print source-bound lexical risks for human review (no approvals)
        run: node daily-v2/scripts/qa-vocab-lexical-risk.mjs
      - name: Validate 16 unapproved numeric method-mark proposals and copy reviewer draft
        run: |
          node daily-v2/scripts/qa-numeric-method-drafts.mjs
          cp daily-v2/review/NUMERIC_METHOD_MARK_PROPOSALS.json "$RUNNER_TEMP/daily-v2-review/"
      - name: Upload Objective and Latin/French vocab human-review workbooks
        uses: actions/upload-artifact@v4
        with:
          name: daily-v2-objective-review-pending
          path: ${{ runner.temp }}/daily-v2-review/
          if-no-files-found: error
          retention-days: 30
