name: Verify Latin Booklet Daily Live
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/latin-booklet-daily-live-20261023.yml
      - assets/latin-vocabulary-booklet-20261023.js
      - assets/daily-vocab-y9-20261021.js
      - assets/daily-vocab-20261003.js
      - assets/study._subject.practise-y8fix-20260920.js
      - study/latin/practise/index.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check live Latin Daily entry and source assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://glojournal-cmyk.github.io"
          for attempt in {1..22}; do
            curl --retry 1 -fsSL --max-time 20 "$base/study/latin/practise/?v=$GITHUB_SHA" -o /tmp/latin-page
            curl --retry 1 -fsSL --max-time 20 "$base/assets/study._subject.practise-y8fix-20260920.js?v=$GITHUB_SHA" -o /tmp/latin-practice
            curl --retry 1 -fsSL --max-time 20 "$base/assets/study._subject.practise-D_PWgUd7.js?v=$GITHUB_SHA" -o /tmp/latin-practice-modern
            curl --retry 1 -fsSL --max-time 20 "$base/assets/index-BLVOhKhN.core.js?v=$GITHUB_SHA" -o /tmp/latin-core
            curl --retry 1 -fsSL --max-time 20 "$base/assets/daily-vocab-20261003.js?v=$GITHUB_SHA" -o /tmp/latin-selector
            curl --retry 1 -fsSL --max-time 20 "$base/assets/daily-vocab-y9-20261021.js?v=$GITHUB_SHA" -o /tmp/latin-y9
            curl --retry 1 -fsSL --max-time 20 "$base/assets/latin-vocabulary-booklet-20261023.js?v=$GITHUB_SHA" -o /tmp/latin-book
            if grep -q 'study._subject.practise-y8fix-20260920.js' /tmp/latin-page &&
               grep -q 'study._subject.practise-D_PWgUd7.js?v=20261023-study-catalog-fix2' /tmp/latin-core &&
               grep -q '20261023-latinbooklet277-v1' /tmp/latin-practice &&
               grep -q '20261023-latinbooklet277-v1' /tmp/latin-practice-modern &&
               grep -q 'LATIN_BOOKLET_GROUPS' /tmp/latin-selector &&
               grep -q 'canonicalKeys' /tmp/latin-y9 &&
               grep -q 'LATIN_BOOKLET_RECORDS' /tmp/latin-book; then
              echo 'LATIN_BOOKLET_277_LIVE deployed sources and exact practice import confirmed'
              exit 0
            fi
            sleep 8
          done
          echo '::error::Latest Latin Daily vocabulary modules not yet published'
          exit 1
