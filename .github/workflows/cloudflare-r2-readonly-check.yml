name: Cloudflare R2 Read-only Access Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify existing Cloudflare token and R2 list permission
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CF_API_TOKEN:-}" || -z "${CF_ACCOUNT_ID:-}" ]]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID GitHub secret."
            exit 1
          fi
          echo "Both Cloudflare secret values are present (values not printed)."
          auth_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            'https://api.cloudflare.com/client/v4/user/tokens/verify')
          if [[ "$auth_code" != "200" ]]; then
            echo "::error::Cloudflare token verification HTTP $auth_code."
            exit 1
          fi
          echo "Cloudflare token verification endpoint returned HTTP 200."
          bucket_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets")
          case "$bucket_code" in
            200) echo "R2 bucket LIST permission: confirmed (HTTP 200)." ;;
            401|403) echo "::error::R2 bucket LIST denied (HTTP $bucket_code). Token may need R2 read/list permissions."; exit 1 ;;
            *) echo "::error::R2 bucket LIST returned HTTP $bucket_code; inspect permissions/account settings."; exit 1 ;;
          esac
          echo "Read-only check finished. No buckets were created, changed, or deleted."
