name: Capture Inkling Ten-Level Real App Preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inkling-all10-screenshots.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Capture ten Inkling evolution cards in an isolated temporary profile
        run: node tests/inkling-all10-screenshots.mjs
      - name: Publish screenshot evidence (not user data)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pet/previews/inkling-all10-20261018/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add actual App screenshot gallery for Inkling LV1-LV10"
          git pull --rebase origin main
          git push origin HEAD:main
