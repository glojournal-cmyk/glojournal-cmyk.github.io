name: repair French MC quality once
on:
  push:
    branches: [main]
    paths:
      - tests/repair-french-mc-quality.mjs
      - .github/workflows/repair-french-mc-quality.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild French MC distractors
        run: node tests/repair-french-mc-quality.mjs
      - name: Commit improved French questions
        run: |
          if git diff --quiet -- content/topics; then
            echo "No French MC changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/topics
          git commit -m "Improve French MC distractor quality"
          git push
