name: iPad compact save warning and emergency export QA
on:
  pull_request:
    paths:
      - 'assets/storage-health-20261011.js'
      - 'tests/ipad-compact-storage-warning-20261020.mjs'
      - '.github/workflows/ipad-compact-storage-warning-qa.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  compact-warning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check assets/storage-health-20261011.js
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps webkit chromium
      - run: node tests/ipad-compact-storage-warning-20261020.mjs
