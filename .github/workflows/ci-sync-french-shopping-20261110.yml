name: Temporary French Answer and Recovery iPad route sync
on:
  push:
    branches: [fix/chem-recovery-20-french-au-shopping-20261110]
    paths:
      - '.github/workflows/ci-sync-french-shopping-20261110.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chem-recovery-20-french-au-shopping-20261110
          persist-credentials: true
      - name: Synchronize exactly one iPad app URL across all active routes
        run: python3 scripts/sync-route-shells.py
      - name: Run canonical entrypoint and web route QA
        run: |
          node --test tests/canonical-entrypoint-20261026.test.mjs
          node tests/route-shell-qa.mjs
      - name: Commit only tracked URL-sync changes into this PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Keep all route shells on French translation bank cache version"
            git push origin HEAD:fix/chem-recovery-20-french-au-shopping-20261110
          fi
