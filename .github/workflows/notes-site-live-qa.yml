name: Gloria Notes Public Site Check
on:
  pull_request:
    paths: [.github/workflows/notes-site-live-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify deployed Notes page and manifest
        shell: bash
        run: |
          set -euo pipefail
          base="https://glojournal-cmyk.github.io"
          for i in 1 2 3 4 5; do
            if curl -fsSL --max-time 20 "$base/notes/" | grep -q 'Notes Library';then
              echo "Notes Library page is live."
              break
            fi
            if [[ "$i" = 5 ]];then echo "::error::Notes Library page is not public yet";exit 1;fi
            sleep 5
          done
          curl -fsSL --max-time 20 "$base/notes/catalog.json" | python3 -c 'import json,sys; x=json.load(sys.stdin); assert len(x["notes"])==87;print("Published Notes catalog has",len(x["notes"]),"entries")'
          curl -fsSL --max-time 20 "$base/notes/library.js" | grep -q 'gloria-notes-public.glo-journal.workers.dev'
          echo "Public page, catalog and reader JavaScript verified."
