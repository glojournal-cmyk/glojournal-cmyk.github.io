name: Daily V3.1 Maths academic QA iPad browser
on:
  push:
    branches: [feature/daily-tasks-v3-20261122]
    paths:
      - '.github/workflows/daily-v3-maths-browser-20261122.yml'
      - 'study/maths/daily/index.html'
      - 'assets/math-study/daily-v31-qa-preview.js'
      - 'assets/math-study/math-v31-native-mathml.js'
      - 'qa-staging/math-v31-original-sample10.json'
      - 'qa-staging/math-v311-reviewed-200.json'
      - 'tests/daily-v3-maths-ipad-browser-20261122.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maths-ipad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser emulators
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Confirm offline MathML QA-only preview, 6-option grading and no learner state writes
        run: node tests/daily-v3-maths-ipad-browser-20261122.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maths-v31-ipad-sample10-evidence
          path: test-results/maths-v31-ipad-qa/
          retention-days: 14
