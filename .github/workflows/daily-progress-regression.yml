name: Daily progress regression
on:
  push:
    branches: [main]
    paths:
      - 'assets/index-BLVOhKhN.js'
      - 'assets/daily-vocab-20261003.js'
      - 'assets/daily-completed-session-receipts-20261024.js'
      - 'assets/journey-navigation-20261004.js'
      - 'tests/journey-ipad-date-iso-20261024.test.mjs'
      - 'assets/quiz-session-y8fix-20260920.js'
      - 'tests/latin-stage1-ipad-completion-receipt-20261024.test.mjs'
      - 'assets/study._subject.practise-y8fix-20260920.js'
      - 'assets/progression-guard-20260927.js'
      - 'tests/daily-*.mjs'
      - 'tests/mastery-v2-qa.mjs'
      - 'tests/backup-export.test.mjs'
      - 'tests/storage-quota.test.mjs'
      - 'assets/quest-recovery-20261011.js'
      - 'assets/backup-vault-20261011.js'
      - '.github/workflows/daily-progress-regression.yml'
  workflow_dispatch:
jobs:
  daily-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check changed runtime syntax
        run: |
          node --check assets/index-BLVOhKhN.js
          node --check assets/study._subject.practise-y8fix-20260920.js
          node --check assets/study._subject.practise-D_PWgUd7.js
          node --check assets/daily-unfinished-retry-20261025.js
          node --check assets/daily-completed-session-receipts-20261024.js
          node --check assets/quiz-session-y8fix-20260920.js
          node --check assets/progression-guard-20260927.js
      - name: Test formal counting, reload and refill
        run: |
          node tests/daily-mistake-review-qa.mjs
          node tests/daily-vocab-only-qa.mjs
          node tests/daily-formal-evidence-qa.mjs
          node tests/daily-counting-regression-qa.mjs
          node tests/daily-task-persistence-qa.mjs
      - name: Test Year 8 daily Mastery to Mastered progression
        run: |
          node --test tests/daily-mastered-loop-20261023.test.mjs
          node --test tests/daily-correct-only-20261024.test.mjs
          node --test tests/daily-session-credit-20261021.test.mjs
          node --test tests/daily-biology-fifteen-credit-20261025.test.mjs
          node --test tests/daily-wrong-question-resume-20261025.test.mjs
          node --test tests/daily-ten-to-six-ipad-regression-20261025.test.mjs
          node --test tests/daily-no-repeat-correct-20261025.test.mjs
          node --test tests/daily-resume-stable-drafts-20261025.test.mjs
          node tests/daily-locked-empty-20261021.mjs
          node --test tests/biology-food-tests-depleted-bank-20261025.test.mjs
          node --test tests/latin-stage1-ipad-completion-receipt-20261024.test.mjs
          node --test tests/journey-ipad-date-iso-20261024.test.mjs
          node --test tests/today-record-sync-20261024.test.mjs
          node --test tests/mastery-v2-qa.mjs
      - name: Test independent recovery and backup integrity
        run: |
          node --test tests/recovery-quest.test.mjs tests/backup-export.test.mjs tests/backup-vault.test.mjs tests/storage-quota.test.mjs
