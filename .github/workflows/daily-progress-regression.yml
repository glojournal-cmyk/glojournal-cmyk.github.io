name: Daily progress regression
on:
  push:
    branches: [main]
    paths:
      - 'assets/index-BLVOhKhN.js'
      - 'assets/daily-vocab-20261003.js'
      - 'assets/study._subject.practise-y8fix-20260920.js'
      - 'assets/progression-guard-20260927.js'
      - 'tests/daily-*.mjs'
      - 'tests/mastery-v2-qa.mjs'
      - 'tests/backup-export.test.mjs'
      - 'tests/storage-quota.test.mjs'
      - 'assets/quest-recovery-20261011.js'
      - 'assets/backup-vault-20261011.js'
      - '.github/workflows/daily-progress-regression.yml'
  workflow_dispatch:
jobs:
  daily-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check changed runtime syntax
        run: |
          node --check assets/index-BLVOhKhN.js
          node --check assets/study._subject.practise-y8fix-20260920.js
          node --check assets/progression-guard-20260927.js
      - name: Test formal counting, reload and refill
        run: |
          node tests/daily-mistake-review-qa.mjs
          node tests/daily-vocab-only-qa.mjs
          node tests/daily-formal-evidence-qa.mjs
          node tests/daily-counting-regression-qa.mjs
          node tests/daily-task-persistence-qa.mjs
      - name: Test Year 8 daily Mastery to Mastered progression
        run: |
          node --test tests/daily-mastered-loop-20261023.test.mjs
          node --test tests/daily-correct-only-20261024.test.mjs
          node --test tests/daily-session-credit-20261021.test.mjs
          node --test tests/mastery-v2-qa.mjs
      - name: Test independent recovery and backup integrity
        run: |
          node --test tests/recovery-quest.test.mjs tests/backup-export.test.mjs tests/backup-vault.test.mjs tests/storage-quota.test.mjs
