name: Whole site QA
on:
  workflow_dispatch:
  pull_request:
    paths: ['tests/**', 'assets/**', 'content/**', 'assessment/**', 'pet/**', '**/*.html', '*.js', '*.css', '.github/workflows/site-browser-qa.yml']
  push:
    branches: [main]
    paths: ['tests/**', 'assets/**', 'content/**', 'assessment/**', 'pet/**', '**/*.html', '*.js', '*.css', '.github/workflows/site-browser-qa.yml']
jobs:
  all-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node tests/all-feature-qa.mjs
      - name: Verify production route and runtime imports
        run: |
          node tests/route-shell-qa.mjs
          node tests/overall-app-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: all-feature-qa, path: test-results}
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify October Latin questions and marking in Chromium and iPad WebKit
        run: node tests/latin-oct17-browser.mjs
      - name: Verify Latin topics inside native Study and Practise
        run: node tests/latin-october-study-browser.mjs
      - name: Check this checkout in Chromium and iPad WebKit
        run: |
          python3 -m http.server 8777 --bind 127.0.0.1 >/tmp/whole-site-qa-http.log 2>&1 &
          QA_BASE_URL=http://127.0.0.1:8777 node tests/site-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whole-site-browser-qa
          path: |
            test-results/site-browser-qa.json
            test-results/latin-oct17/
            test-results/latin-study/
