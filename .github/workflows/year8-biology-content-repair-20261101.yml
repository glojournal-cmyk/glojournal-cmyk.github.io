name: Year 8 Biology content repair QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'content/catalog.json'
      - 'content/topics/bio-y8-ber.json'
      - 'content/topics/bio-y8-continuous-variation.json'
      - 'content/topics/bio-y8-correlation.json'
      - 'content/topics/bio-y8-mixed-exam.json'
      - 'content/topics/bio-y8-nutrition-labels.json'
      - 'content/topics/bio-y8-practical-conclusions.json'
      - 'content/topics/bio-y8-limiting-factors.json'
      - 'tests/year8-biology-content-repair-20261101.mjs'
      - '.github/workflows/year8-biology-content-repair-20261101.yml'
jobs:
  source-preservation-and-marking:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: git fetch origin main --depth=1
      - run: node --check tests/year8-biology-content-repair-20261101.mjs
      - run: node tests/year8-biology-content-repair-20261101.mjs
      - run: node tests/year8-biology-live-marking-20261101.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: year8-biology-live-marking-report
          path: test-results/year8-biology-live-marking-20261101.json
          if-no-files-found: warn
