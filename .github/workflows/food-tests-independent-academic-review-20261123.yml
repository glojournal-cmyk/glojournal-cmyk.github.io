  workflow_dispatch:
permissions:
  contents: read
jobs:
  academic-review-register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check independent academic consistency script syntax
        run: node --check tests/food-tests-academic-143-review-20261123.test.mjs
      - name: Validate exact 143-item review and 99 candidate point references; never approve by test alone
        run: node --test tests/food-tests-academic-143-review-20261123.test.mjs
      - name: Verify 48 QA-only duplicate replacements are unique and never formally credited
        run: node --test tests/food-tests-48-replacement-candidate-20261123.test.mjs
      - name: Verify 143-row candidate preview retains 95 originals and blocks all scoring
        run: node --test tests/food-tests-143-preview-qa-20261123.test.mjs
      - name: Verify both original matching scorers return 0-4 independently earned marks
        run: node --test tests/food-tests-matching-scoring-20261123.test.mjs
      - name: Check fifteen typed valid alternatives and contradictory negations against both quiz scorers
        run: node --test tests/food-tests-typed-15-adversarial-20261123.test.mjs
