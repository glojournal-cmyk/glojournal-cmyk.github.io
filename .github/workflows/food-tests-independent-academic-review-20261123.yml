jobs:
  academic-review-register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check independent academic consistency script syntax
        run: node --check tests/food-tests-academic-143-review-20261123.test.mjs
      - name: Validate exact 143-item review and 99 candidate point references; never approve by test alone
        run: node --test tests/food-tests-academic-143-review-20261123.test.mjs
      - name: Audit all 99 MCQ mark points against 52 source concepts and 9 repeated-answer clusters, still 0 approved
        run: node --test tests/food-tests-99-concept-collision-20261123.test.mjs
      - name: Review all 297 individually reasoned structured MCQ distractors without teacher approval
        run: node --test tests/food-tests-297-distractor-first-pass-20261123.test.mjs
      - name: Check cross-answer semantic overlap families and prevent duplicate-mastery claims in held QA pool
        run: node --test tests/food-tests-99-semantic-overlap-20261123.test.mjs
      - name: "Academic content QA: validate 143 original source dispositions plus 48 and 99 unapproved candidate science reviews"
        run: |
          node --test tests/food-tests-25-mcq-content-adjudication-20261124.test.mjs
          node --test tests/food-tests-15-typed-3-matching-content-20261124.test.mjs
          node --test tests/food-tests-48-content-adjudication-20261124.test.mjs
          node --test tests/food-tests-99-structured-content-adjudication-20261124.test.mjs
          node --test tests/food-tests-143-academic-content-dispositions-20261124.test.mjs
      - name: Verify 16 held original case prompts have realistic unimported observation revisions without altering science answers
        run: node --test tests/food-tests-16-concrete-observation-proposals-20261124.test.mjs
      - name: Check 16 revised near-miss draft cases and preserve credit hold
        run: node --test tests/food-tests-16-near-miss-distractors-20261124.test.mjs
      - name: Verify all 144 draft wrong-choice reasons map to the current 48 held MCQs
        run: node --test tests/food-tests-48-144-foil-reasons-20261124.test.mjs
      - name: Verify 48 QA-only duplicate replacements are unique and never formally credited
        run: node --test tests/food-tests-48-replacement-candidate-20261123.test.mjs
      - name: Verify 143-row candidate preview retains 95 originals and blocks all scoring
        run: node --test tests/food-tests-143-preview-qa-20261123.test.mjs
      - name: Verify both original matching scorers return 0-4 independently earned marks
        run: node --test tests/food-tests-matching-scoring-20261123.test.mjs
      - name: Check fifteen typed valid alternatives and contradictory negations against both quiz scorers
        run: node --test tests/food-tests-typed-15-adversarial-20261123.test.mjs
