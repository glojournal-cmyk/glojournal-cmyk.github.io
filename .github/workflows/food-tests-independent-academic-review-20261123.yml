name: Food Tests 143-item Independent Content QA Evidence (0 approved)
on:
  push:
    branches:
      - qa/p0-eligibility-2e556ff
    paths:
      - 'content/topics/bio-y8-food-tests.json'
      - 'qa/food-tests-independent-academic-143-review-20261123.json'
      - 'qa/food-tests-academic-correction-proposals-20261123.json'
      - 'qa/food-tests-independent-academic-143-review-20261123.md'
