name: iPad save overlay QA
on:
  pull_request:
    paths:
      - 'assets/storage-health-20261011.js'
      - 'tests/ipad-no-storage-overlay-20261020.mjs'
      - '.github/workflows/ipad-no-storage-overlay-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safari:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/ipad-no-storage-overlay-20261020.mjs
