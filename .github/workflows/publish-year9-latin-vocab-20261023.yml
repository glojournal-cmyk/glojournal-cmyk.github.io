name: Publish Year 9 Latin illustrated vocabulary notes
on:
  push:
    paths:
      - .github/workflows/publish-year9-latin-vocab-20261023.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: latin-vocab-notes-import
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact six-page original, verify and split
        env:
          PDF_SOURCE: https://at.adobe.com/7jgfMnIgtufSg5uN
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 4 --max-time 200 -o /tmp/y9-latin-vocab.pdf "$PDF_SOURCE"
          echo "1b24e11515a5ad6af7e7b7b3de7f8851afd2990e15e86f56b3941fe48a55f806  /tmp/y9-latin-vocab.pdf" | sha256sum --check
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader, PdfWriter
          from pathlib import Path
          src=PdfReader('/tmp/y9-latin-vocab.pdf')
          assert len(src.pages)==6, 'Expected exactly six image-based note pages'
          out=Path('notes/pdf/year9/latin')
          out.mkdir(parents=True, exist_ok=True)
          for idx,page in enumerate(src.pages,1):
              writer=PdfWriter()
              writer.add_page(page)
              file=out/f'Year9_Latin_Vocabulary_Chapter_{idx}.pdf'
              with file.open('wb') as f: writer.write(f)
              assert file.stat().st_size>100_000
              print(f'{file}: {file.stat().st_size} bytes, 1 page')
          PY
      - name: Commit exact image-page PDFs to existing GitHub Pages site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/pdf/year9/latin/Year9_Latin_Vocabulary_Chapter_*.pdf
          if git diff --cached --quiet; then
            echo "Already published"
          else
            git commit -m "Publish six Year 9 Latin image vocabulary chapter PDFs"
            git push origin HEAD:main
          fi
