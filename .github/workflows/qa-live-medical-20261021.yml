name: Verify Medical Collection on Live GitHub Pages
on:
  push:
    paths:
      - .github/workflows/qa-live-medical-20261021.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify public release with retries
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base='https://glojournal-cmyk.github.io'
          for attempt in $(seq 1 12); do
            echo "Public GitHub Pages asset check attempt $attempt / 12"
            if curl -fLsS --max-time 20 -H 'Cache-Control: no-cache' "$base/" | grep -q '20261021-medical-careers1' && \
               curl -fLsS --max-time 20 -H 'Cache-Control: no-cache' "$base/assets/index-BLVOhKhN.core.js?v=20261021-medical-careers1" | grep -q 'medical-01-forensic-pathologist' && \
               curl -fLsS --max-time 20 -H 'Cache-Control: no-cache' "$base/art/doll/medical/manifest.json" | grep -q 'Forensic Pathologist' && \
               curl -fILsS --max-time 20 "$base/art/doll/medical/01-forensic-pathologist.png" >/dev/null && \
               curl -fILsS --max-time 20 "$base/art/doll/medical/10-medical-student.png" >/dev/null; then
              echo "Public site is current and both first and last outfit PNGs are HTTP 200"
              exit 0
            fi
            sleep 15
          done
          exit 1
      - name: Record live release verification
        if: always()
        env:
          LIVE_OUTCOME: ${{ steps.verify.outcome }}
          LIVE_RUN: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import datetime,json,os,pathlib
          d={'outcome':os.environ.get('LIVE_OUTCOME'),'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'liveUrl':'https://glojournal-cmyk.github.io/','runUrl':os.environ.get('LIVE_RUN')}
          pathlib.Path('qa/medical-outfits-live.json').write_text(json.dumps(d,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/medical-outfits-live.json
          git commit -m 'Record real GitHub Pages Medical outfits deployment check'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Enforce deployed assets
        if: always()
        env:
          LIVE_OUTCOME: ${{ steps.verify.outcome }}
        run: test "$LIVE_OUTCOME" = "success"
