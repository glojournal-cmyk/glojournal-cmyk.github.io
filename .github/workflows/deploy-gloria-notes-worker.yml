name: Deploy Gloria Public Notes Reader
on:
  push:
    branches: [main]
    paths:
      - cloudflare-notes/**
      - .github/workflows/deploy-gloria-notes-worker.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cloudflare-notes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public read-only worker
        run: |
          node --check worker.mjs
          grep -q "gloria-notes-library" wrangler.jsonc
          if grep -E 'BACKUPS|gloria-private-encrypted-backups|NOTES.put|NOTES.delete' worker.mjs wrangler.jsonc; then
            echo "::error::Forbidden backup or write reference"; exit 1
          fi
      - name: Verify existing Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy read-only Notes Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
