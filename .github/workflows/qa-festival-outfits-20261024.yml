name: Festival Wardrobe iPad QA
on:
  push:
    branches: [main]
    paths:
      - qa/festival-outfits-smoke.mjs
      - .github/workflows/qa-festival-outfits-20261024.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install browsers
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Serve the actual production website
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 > /tmp/gloria-festival-http.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8787/ > /dev/null && break; sleep 1; done
          curl -fsSI http://127.0.0.1:8787/art/doll/festival/01-halloween.webp | head -n 4
      - name: Test iPad Safari, Chrome, Home and saved selection
        id: festivalqa
        continue-on-error: true
        run: node qa/festival-outfits-smoke.mjs
      - name: Upload screenshots and outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: festival-wardrobe-ipad-qa
          path: qa-artifacts/festival/
          if-no-files-found: ignore
      - name: Record QA verdict
        if: always()
        env:
          OUTCOME: ${{ steps.festivalqa.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os,json,datetime,pathlib
          p=pathlib.Path('qa-artifacts/festival/result.json')
          rows=json.loads(p.read_text()) if p.exists() else []
          data={'outcome':os.environ['OUTCOME'],'url':os.environ['RUN_URL'],'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scenarios':rows}
          pathlib.Path('qa/festival-outfits-latest.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/festival-outfits-latest.json
          git commit -m 'Record Festival Wardrobe iPad QA results' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Enforce QA
        if: always()
        env:
          OUTCOME: ${{ steps.festivalqa.outcome }}
        run: test "$OUTCOME" = "success"
