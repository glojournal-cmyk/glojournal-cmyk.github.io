name: iPad current progress emergency export QA
on:
  pull_request:
    paths:
      - 'assets/storage-health-20261011.js'
      - 'tests/ipad-inplace-progress-export-20261020.mjs'
      - '.github/workflows/ipad-inplace-progress-export-20261020.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  live-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check assets/storage-health-20261011.js
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify live export despite quota and leave Practice intact
        run: node tests/ipad-inplace-progress-export-20261020.mjs
