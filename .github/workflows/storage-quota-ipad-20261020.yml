name: iPad storage quota recovery
on:
  push:
    branches: [main]
    paths:
      - "assets/backup-vault-20261011.js"
      - "assets/storage-health-20261011.js"
      - "assets/daily-progress-save.js"
      - "assets/index-BLVOhKhN.core.js"
      - "tests/storage-quota-ipad-20261020.mjs"
      - "tests/ipad-rewards-vault-webkit-20261030.mjs"
      - "tests/pet-wallet-combined-backup-20261030.test.mjs"
      - "tests/pet-wallet-standalone-import-20261030.test.mjs"
      - "tests/pet-wallet-core-import-gate-20261030.test.mjs"
      - "tests/backup-signature-stability-20261031.test.mjs"
      - "tests/backup-file-audit-20261031.test.mjs"
      - "assets/backup-file-audit-20261031.js"
      - "assets/index-BLVOhKhN.js"
      - "assets/standalone-progress-import-20261023.js"
      - "assets/pet-wallet-backup-20261030.js"
      - "assets/latest-30-day-export-20261023.js"
      - "assets/recovery-receipt-20261018.js"
      - ".github/workflows/storage-quota-ipad-20261020.yml"
  pull_request:
    paths:
      - "assets/backup-vault-20261011.js"
      - "assets/storage-health-20261011.js"
      - "assets/daily-progress-save.js"
      - "assets/index-BLVOhKhN.core.js"
      - "tests/storage-quota-ipad-20261020.mjs"
      - "tests/ipad-rewards-vault-webkit-20261030.mjs"
      - "tests/pet-wallet-combined-backup-20261030.test.mjs"
      - "tests/pet-wallet-standalone-import-20261030.test.mjs"
      - "tests/pet-wallet-core-import-gate-20261030.test.mjs"
      - "tests/backup-signature-stability-20261031.test.mjs"
      - "tests/backup-file-audit-20261031.test.mjs"
      - "assets/backup-file-audit-20261031.js"
      - "assets/index-BLVOhKhN.js"
      - "assets/standalone-progress-import-20261023.js"
      - "assets/pet-wallet-backup-20261030.js"
      - "assets/latest-30-day-export-20261023.js"
      - "assets/recovery-receipt-20261018.js"
      - ".github/workflows/storage-quota-ipad-20261020.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipad-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check assets/backup-vault-20261011.js && node --check assets/storage-health-20261011.js && node --check assets/daily-progress-save.js
      - run: node --check assets/pet-wallet-backup-20261030.js && node --check assets/latest-30-day-export-20261023.js
      - run: node --test tests/storage-quota.test.mjs tests/backup-vault.test.mjs tests/backup-export.test.mjs tests/pet-wallet-combined-backup-20261030.test.mjs tests/pet-wallet-standalone-import-20261030.test.mjs tests/pet-wallet-core-import-gate-20261030.test.mjs tests/backup-signature-stability-20261031.test.mjs tests/backup-file-audit-20261031.test.mjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps webkit
      - run: node tests/storage-quota-ipad-20261020.mjs
      - run: node tests/ipad-rewards-vault-webkit-20261030.mjs
