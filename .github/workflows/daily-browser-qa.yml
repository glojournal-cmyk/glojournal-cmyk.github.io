name: Daily browser QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-browser-qa.yml'
      - 'tests/daily-browser-qa.mjs'
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Test the three reported Daily links in a real browser
        run: |
          python3 -m http.server 8765 > /tmp/daily-qa-server.log 2>&1 &
          node tests/daily-browser-qa.mjs
