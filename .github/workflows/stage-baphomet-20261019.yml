name: Temporary Baphomet sprite transfer
on:
  push:
    branches: [feature/baphomet-assassin-replaces-antler-20261019]
    paths:
      - '.github/workflows/stage-baphomet-20261019.yml'
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download approved user sprites and verify exact SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pet/art-baphomet-assassin-20261019
          curl --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 160 -fSL "https://at.adobe.com/Ilg6OYlj96MUgFfR" -o "pet/art-baphomet-assassin-20261019/level-1.png"
          echo "905e96bd7229ce51c1977ce37d21e06c4d526c9f28eba6df62d9ecee1ab13e5a  pet/art-baphomet-assassin-20261019/level-1.png" | sha256sum -c -
          curl --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 160 -fSL "https://at.adobe.com/mJBeigKaac8UG0lv" -o "pet/art-baphomet-assassin-20261019/level-2.png"
          echo "26b4e988b3d0bbfb76093e77e7725417de4326b38c5779c8c058d2c9f5f8b3be  pet/art-baphomet-assassin-20261019/level-2.png" | sha256sum -c -
          curl --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 160 -fSL "https://at.adobe.com/RVc9wLfRwWS71tjJ" -o "pet/art-baphomet-assassin-20261019/level-3.png"
          echo "f48e410c6b5cd022c1507443efb6d3e7f09a5c6a2cf27dfaaf3edf1048f87be3  pet/art-baphomet-assassin-20261019/level-3.png" | sha256sum -c -
          curl --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 160 -fSL "https://at.adobe.com/D56WBW1IbOh5JBPU" -o "pet/art-baphomet-assassin-20261019/level-4.png"
          echo "9bee11f81757a8731b86908540cfda19e99d70c2e1604d590d26add593ab3ca8  pet/art-baphomet-assassin-20261019/level-4.png" | sha256sum -c -
          curl --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 160 -fSL "https://at.adobe.com/usSLGk2Rm4ALJECb" -o "pet/art-baphomet-assassin-20261019/level-5.png"
          echo "4afddc11aabbfe3e190d877170975bb68d8bdb795481a9608464b81b99eeb741  pet/art-baphomet-assassin-20261019/level-5.png" | sha256sum -c -
          curl --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 160 -fSL "https://at.adobe.com/OxUAt23CC0HQq2yP" -o "pet/art-baphomet-assassin-20261019/level-6.png"
          echo "0c434a408475cc2155a35d224201797de15e8b57b8667b842bc507048050234c  pet/art-baphomet-assassin-20261019/level-6.png" | sha256sum -c -
          curl --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 160 -fSL "https://at.adobe.com/lR5ghorrcJ6zeeEy" -o "pet/art-baphomet-assassin-20261019/level-7.png"
          echo "79543978ab3422f540fc139b74771f0852a13451ef8d052778cbfd71f35b2754  pet/art-baphomet-assassin-20261019/level-7.png" | sha256sum -c -
          curl --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 160 -fSL "https://at.adobe.com/4XCp7u3Itywlb8jF" -o "pet/art-baphomet-assassin-20261019/level-8.png"
          echo "c11ba0731cb305666f5db54a5eaf666ad43e7b2480dd28a91e762d927bee3266  pet/art-baphomet-assassin-20261019/level-8.png" | sha256sum -c -
          curl --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 160 -fSL "https://at.adobe.com/sbfYf4xp3auMkA1X" -o "pet/art-baphomet-assassin-20261019/level-9.png"
          echo "a04761d51bf0eaee7ec711181ead84ed70c7b75748c94eaca93a61915af4c299  pet/art-baphomet-assassin-20261019/level-9.png" | sha256sum -c -
          curl --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 160 -fSL "https://at.adobe.com/Uo9gq2DM0Tvk9LlW" -o "pet/art-baphomet-assassin-20261019/level-10.png"
          echo "e0dfe1d6ec20c49083ef1c445d9b2be541795592ee49f3b5c24778be3a67c4e4  pet/art-baphomet-assassin-20261019/level-10.png" | sha256sum -c -
          python3 - <<'PY'
          import struct, pathlib
          for i in range(1,11):
            p=pathlib.Path(f"pet/art-baphomet-assassin-20261019/level-{i}.png")
            b=p.read_bytes()
            assert b[:8]==bytes.fromhex("89504e470d0a1a0a"), p
            assert struct.unpack(">II",b[16:24])==(1122,1402), p
            assert b[25]==6, (p,"Not RGBA transparent PNG")
            print(f"Level {i}: original RGBA sprite validated")
          PY
      - name: Commit source-verified sprites to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pet/art-baphomet-assassin-20261019/level-*.png
          git commit -m "Add ten user-approved transparent Baphomet evolution sprites"
          git push origin HEAD:feature/baphomet-assassin-replaces-antler-20261019
