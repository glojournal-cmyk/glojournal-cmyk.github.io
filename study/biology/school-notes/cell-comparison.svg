<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Schematic comparison of an animal cell, leaf cell and bacterial cell</title>
<desc id="desc">Three separate simplified cells are labelled. Shapes are not drawn to scale. Animal and leaf cells have nuclei; the bacterium has circular DNA without a nucleus. The leaf cell has a cellulose wall, chloroplasts and a permanent vacuole.</desc>
<rect width="1200" height="520" rx="24" fill="#f8f8f2"/>
<g font-family="Arial, sans-serif" fill="#17344b"><text x="72" y="55" font-size="30" font-weight="700">Animal cell</text><text x="447" y="55" font-size="30" font-weight="700">Leaf cell</text><text x="856" y="55" font-size="30" font-weight="700">Bacterial cell</text></g>
<g stroke="#1c5161" stroke-width="5" stroke-linejoin="round"><ellipse cx="200" cy="243" rx="144" ry="132" fill="#e8ede4"/><ellipse cx="195" cy="227" rx="42" ry="34" fill="#a7b7cc"/><ellipse cx="123" cy="274" rx="24" ry="11" fill="#d4ae82"/><ellipse cx="250" cy="297" rx="22" ry="10" fill="#d4ae82"/>
<rect x="437" y="107" width="300" height="270" rx="22" fill="#d1dcc8" stroke-width="13" stroke="#647f63"/><rect x="451" y="121" width="272" height="242" rx="15" fill="#edf1dc" stroke-width="4"/><rect x="532" y="182" width="146" height="154" rx="22" fill="#d9e8ea" stroke="#638391" stroke-width="3"/><ellipse cx="490" cy="185" rx="25" ry="22" fill="#abbccf"/><ellipse cx="489" cy="295" rx="19" ry="9" fill="#78a777"/><ellipse cx="696" cy="161" rx="17" ry="9" fill="#78a777"/><ellipse cx="696" cy="331" rx="17" ry="9" fill="#78a777"/>
<rect x="832" y="143" width="310" height="203" rx="100" fill="#e8e2c8" stroke="#87714e" stroke-width="11"/><rect x="848" y="159" width="278" height="171" rx="85" fill="#f7f1db" stroke-width="3"/><path d="M910 244c24-35 49-29 60-5s38 31 56-1" fill="none" stroke="#705982" stroke-width="9" stroke-linecap="round"/><circle cx="1057" cy="270" r="17" fill="none" stroke="#705982" stroke-width="6"/><path d="M1141 237c36 5 40 38 58 38" fill="none" stroke="#87714e" stroke-width="6"/>
</g>
<g fill="#17344b" font-family="Arial, sans-serif" font-size="20" text-anchor="middle"><text x="200" y="418">membrane · nucleus · cytoplasm</text><text x="590" y="418">cellulose wall · chloroplasts · vacuole</text><text x="987" y="418">wall · circular DNA · plasmid</text><text x="600" y="487" font-size="17" fill="#5b6770">Simplified teaching diagrams · not drawn to scale · a root or onion epidermal cell may lack chloroplasts</text></g>
</svg>
