<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">Figure C: chromatography results table</title><desc id="desc">A results table lists solvent-front distance, dye distance and Rf values for dyes A to D, with D's Rf missing.</desc>
<rect width="760" height="520" fill="#fff"/>
<text x="34" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17384a">Figure C · Chromatography results</text>
<text x="34" y="78" font-family="Arial,sans-serif" font-size="16" fill="#536a71">All distances are measured from the start line.</text>
<rect x="62" y="132" width="636" height="252" fill="#fff" stroke="#576a73" stroke-width="2"/>
<path d="M62 192H698 M62 240H698 M62 288H698 M62 336H698 M150 132V384 M360 132V384 M550 132V384" stroke="#7a858b" stroke-width="1.3"/>
<g font-family="Arial,sans-serif" font-size="14" fill="#17384a"><text x="91" y="168" font-weight="700">Dye</text><text x="178" y="158" font-weight="700">Distance to solvent front</text><text x="247" y="178" font-weight="700">/ mm</text><text x="390" y="158" font-weight="700">Distance moved by dye</text><text x="454" y="178" font-weight="700">/ mm</text><text x="600" y="168" font-weight="700">Rf</text>
<text x="104" y="222">A</text><text x="252" y="222">64</text><text x="448" y="222">56</text><text x="596" y="222">0.88</text>
<text x="104" y="270">B</text><text x="252" y="270">70</text><text x="448" y="270">42</text><text x="596" y="270">0.60</text>
<text x="104" y="318">C</text><text x="252" y="318">68</text><text x="448" y="318">24</text><text x="596" y="318">0.35</text>
<text x="104" y="366">D</text><text x="252" y="366">60</text><text x="448" y="366">18</text><text x="596" y="366" font-weight="700">?</text></g>
<text x="62" y="430" font-family="Arial,sans-serif" font-size="15" fill="#536a71">Rf = distance moved by dye ÷ distance moved by solvent front</text>
