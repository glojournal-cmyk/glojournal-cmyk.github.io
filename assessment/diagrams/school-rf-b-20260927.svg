<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">Figure B: unknown sample X and reference food colours</title><desc id="desc">Sample X travels 44 mm while the solvent front travels 72 mm. A reference table lists Rf values for four known food colours.</desc>
<rect width="760" height="520" fill="#fff"/>
<text x="32" y="42" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17384a">Figure B · Unknown sample X and reference data</text>
<rect x="56" y="112" width="270" height="308" fill="#fff" stroke="#4d626c" stroke-width="2.5"/>
<path d="M56 128H326" stroke="#17384a" stroke-width="2.2" stroke-dasharray="9 6"/><path d="M56 380H326" stroke="#17384a" stroke-width="2.8"/>
<circle cx="191" cy="226" r="15" fill="#8b718e"/><circle cx="191" cy="226" r="3.8" fill="#17384a"/>
<text x="184" y="456" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17384a">X</text>
<g font-family="Arial,sans-serif" font-size="15" fill="#536a71"><text x="344" y="133">Solvent front = 72 mm</text><text x="344" y="231">X = 44 mm</text><text x="344" y="385">Start line = 0 mm</text></g>
<text x="410" y="112" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17384a">Reference table</text>
