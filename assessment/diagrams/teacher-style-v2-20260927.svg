<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">Reference food colours and unknown black sample</title><desc id="desc">Reference lanes A to E and a black sample are shown on one chromatogram. A and E align with two of the black sample spots.</desc>
<rect width="760" height="520" fill="#ffffff"/>
<text x="34" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17384a">Reference food colours and unknown sample</text>
<rect x="72" y="94" width="590" height="330" fill="#fff" stroke="#49636e" stroke-width="2.8"/>
<path d="M72 138H662" stroke="#17384a" stroke-width="2.4" stroke-dasharray="10 7"/>
<path d="M72 382H662" stroke="#17384a" stroke-width="3"/>
<g fill="#7e93a3"><circle cx="125" cy="340" r="13"/><circle cx="220" cy="354" r="10"/><circle cx="315" cy="300" r="13"/><circle cx="410" cy="220" r="13"/><circle cx="505" cy="270" r="13"/></g>
<g fill="#303d49"><circle cx="610" cy="340" r="13"/><circle cx="610" cy="270" r="13"/><circle cx="610" cy="170" r="13"/></g>
<g font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17384a"><text x="119" y="468">A</text><text x="214" y="468">B</text><text x="309" y="468">C</text><text x="404" y="468">D</text><text x="499" y="468">E</text><text x="584" y="468">Black</text></g>
<g font-family="Arial,sans-serif" font-size="15" fill="#536a71"><text x="524" y="126">Solvent front</text><text x="550" y="410">Start line</text></g>
</svg>
