<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">Figure F: measuring to the centre of a chromatography spot</title><desc id="desc">A broad blue spot has a marked centre 32 mm from the start line. The solvent front is 64 mm from the start line.</desc>
<rect width="760" height="520" fill="#fff"/>
<text x="34" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17384a">Figure F · Measure to the centre of the spot</text>
<rect x="150" y="82" width="280" height="352" fill="#fff" stroke="#4d626c" stroke-width="2.6"/>
<path d="M150 112H430" stroke="#17384a" stroke-width="2.3" stroke-dasharray="10 7"/><path d="M150 400H430" stroke="#17384a" stroke-width="3"/>
<circle cx="290" cy="256" r="28" fill="#79aede" opacity=".75"/><circle cx="290" cy="256" r="5" fill="#174c86"/>
<path d="M515 112V400" stroke="#17384a" stroke-width="2.4"/>
<g stroke="#17384a" stroke-width="2"><path d="M515 400h24"/><path d="M515 355h14"/><path d="M515 310h14"/><path d="M515 265h14"/><path d="M515 220h14"/><path d="M515 175h14"/><path d="M515 130h14"/><path d="M515 112h24"/></g>
<g font-family="Arial,sans-serif" font-size="16" fill="#17384a"><text x="550" y="406">0</text><text x="550" y="362">10</text><text x="550" y="317">20</text><text x="550" y="272">30</text><text x="550" y="227">40</text><text x="550" y="182">50</text><text x="550" y="143">60</text><text x="550" y="111">64</text></g>
<text x="150" y="476" font-family="Arial,sans-serif" font-size="16" fill="#536a71">Start line = 0 mm</text><text x="515" y="476" font-family="Arial,sans-serif" font-size="16" fill="#536a71">Distance / mm</text>
<text x="330" y="250" font-family="Arial,sans-serif" font-size="15" fill="#536a71">centre = 32 mm</text>
</svg>
