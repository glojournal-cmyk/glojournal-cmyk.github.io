<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">Microscope field of view with five onion epidermal cells across its diameter</title>
<desc id="desc">A circle represents the field of view. Five equal schematic onion epidermal cells are drawn across a horizontal diameter. The measured field diameter is 0.50 millimetres; the cells are simplified and are not a photomicrograph.</desc>
<defs><clipPath id="field"><circle cx="450" cy="230" r="133"/></clipPath></defs>
<rect width="900" height="450" rx="24" fill="#f8f8f2"/>
<text x="60" y="62" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17344b">Onion epidermis · microscope view</text>
<circle cx="450" cy="230" r="135" fill="#eef1e6" stroke="#1b5262" stroke-width="4"/>
<g clip-path="url(#field)" fill="#d6e3ce" stroke="#53745c" stroke-width="3"><rect x="315" y="203" width="54" height="54" rx="5"/><rect x="369" y="203" width="54" height="54" rx="5"/><rect x="423" y="203" width="54" height="54" rx="5"/><rect x="477" y="203" width="54" height="54" rx="5"/><rect x="531" y="203" width="54" height="54" rx="5"/></g>
<g clip-path="url(#field)" fill="#8b9dae"><circle cx="340" cy="221" r="7"/><circle cx="395" cy="238" r="7"/><circle cx="449" cy="221" r="7"/><circle cx="503" cy="238" r="7"/><circle cx="557" cy="221" r="7"/></g>
<path d="M315 385h270m-270-10v20m270-20v20" fill="none" stroke="#17344b" stroke-width="3"/>
<text x="450" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17344b">Field of view diameter: 0.50 mm</text>
<text x="450" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#17344b">5 cells</text>
</svg>
