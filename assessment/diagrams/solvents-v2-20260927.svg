<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">Figure 4: same dyes in different solvents</title><desc id="desc">Two chromatograms compare the same three dyes using water and ethanol. The spots are more widely separated in water and more clustered in ethanol.</desc>
<rect width="760" height="520" fill="#ffffff"/>
<text x="34" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17384a">Figure 4 · Same dyes, different solvents</text>
<text x="34" y="76" font-family="Arial,sans-serif" font-size="16" fill="#536a71">Compare how clearly the three dyes separate.</text>
<rect x="105" y="104" width="220" height="320" fill="#fff" stroke="#49636e" stroke-width="2.8"/>
<rect x="435" y="104" width="220" height="320" fill="#fff" stroke="#49636e" stroke-width="2.8"/>
<path d="M105 382H325 M435 382H655" stroke="#17384a" stroke-width="3"/>
<path d="M105 142H325 M435 142H655" stroke="#17384a" stroke-width="2.4" stroke-dasharray="10 7"/>
<circle cx="215" cy="180" r="16" fill="#d45559"/><circle cx="215" cy="260" r="16" fill="#3b7fbd"/><circle cx="215" cy="338" r="16" fill="#e8c749" stroke="#b79b30" stroke-width="2"/>
<circle cx="545" cy="246" r="16" fill="#d45559"/><circle cx="545" cy="278" r="16" fill="#3b7fbd"/><circle cx="545" cy="310" r="16" fill="#e8c749" stroke="#b79b30" stroke-width="2"/>
<g font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#17384a"><text x="184" y="468">Water</text><text x="505" y="468">Ethanol</text></g>
</svg>
