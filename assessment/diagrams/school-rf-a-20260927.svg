<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">Figure A: food colour C and reference Rf data</title><desc id="desc">Food colour C travels 24 mm while the solvent front travels 60 mm. A reference table lists Rf values for four food colours.</desc>
<rect width="760" height="520" fill="#fff"/>
<text x="32" y="42" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17384a">Figure A · Food colour C and reference data</text>
<text x="32" y="68" font-family="Arial,sans-serif" font-size="15" fill="#536a71">Use the chromatogram and the table together.</text>
<rect x="60" y="110" width="270" height="310" fill="#fff" stroke="#4d626c" stroke-width="2.5"/>
<path d="M60 140H330" stroke="#17384a" stroke-width="2.2" stroke-dasharray="9 6"/><path d="M60 380H330" stroke="#17384a" stroke-width="2.8"/>
<circle cx="195" cy="284" r="15" fill="#6d90a8"/><circle cx="195" cy="284" r="3.8" fill="#17384a"/>
<text x="188" y="456" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17384a">C</text>
<path d="M345 140h16 M345 380h16 M345 284h16" stroke="#536a71" stroke-width="1.8"/>
<g font-family="Arial,sans-serif" font-size="15" fill="#536a71"><text x="368" y="145">Solvent front = 60 mm</text><text x="368" y="289">C = 24 mm</text><text x="368" y="385">Start line = 0 mm</text></g>
<text x="400" y="110" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17384a">Reference table</text>
<rect x="400" y="126" width="300" height="220" fill="#fff" stroke="#5a6870" stroke-width="1.8"/>
<path d="M400 170H700 M400 214H700 M400 258H700 M400 302H700 M550 126V346" stroke="#7a858b" stroke-width="1.2"/>
<g font-family="Arial,sans-serif" font-size="14" fill="#17384a"><text x="420" y="154" font-weight="700">Food colour</text><text x="600" y="154" font-weight="700">Rf</text><text x="415" y="198">Ponceau 4R</text><text x="602" y="198">0.90</text><text x="415" y="242">Carmoisine</text><text x="602" y="242">0.65</text><text x="415" y="286">Fast red</text><text x="602" y="286">0.40</text><text x="415" y="330">Erythrosine</text><text x="602" y="330">0.28</text></g>
</svg>
