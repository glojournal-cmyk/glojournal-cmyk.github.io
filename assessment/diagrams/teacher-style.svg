<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="title desc">
<title id="title">Chromatogram of reference food colours and black sample</title><desc id="desc">Lanes A to E and a black sample are shown on one chromatogram. Compare horizontal spot positions to identify components.</desc>
<rect width="640" height="430" rx="18" fill="#fcfbf6"/>
<text x="28" y="38" fill="#17384a" font-family="Arial,sans-serif" font-weight="700" font-size="21">Reference food colours and unknown sample</text>
<rect x="44" y="72" width="475" height="284" fill="#fff" stroke="#49636e" stroke-width="3"/>
<path d="M44 110h475" stroke="#17384a" stroke-width="2.5" stroke-dasharray="8 5"/><path d="M44 321h475" stroke="#17384a" stroke-width="3"/>
<g fill="#788c9c"><circle cx="81" cy="277" r="12"/><circle cx="155" cy="321" r="9"/><circle cx="229" cy="245" r="12"/><circle cx="303" cy="198" r="12"/><circle cx="377" cy="224" r="12"/></g>
<g fill="#303d49"><circle cx="475" cy="277" r="12"/><circle cx="475" cy="224" r="12"/><circle cx="475" cy="148" r="12"/></g>
<g fill="#17384a" font-family="Arial,sans-serif" font-size="18" font-weight="700"><text x="75" y="390">A</text><text x="149" y="390">B</text><text x="223" y="390">C</text><text x="297" y="390">D</text><text x="371" y="390">E</text><text x="447" y="390">Black</text></g>
<path d="M519 110h14 M519 321h14" stroke="#536a71" stroke-width="2"/><g fill="#536a71" font-family="Arial,sans-serif" font-size="15"><text x="537" y="116">Solvent</text><text x="537" y="136">front</text><text x="537" y="327">Start</text><text x="537" y="347">line</text></g>
</svg>
