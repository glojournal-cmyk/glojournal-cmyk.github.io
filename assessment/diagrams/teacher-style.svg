<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 380" role="img" aria-labelledby="title desc"><title id="title">Known food colours A to E and black food colouring</title><desc id="desc">Chromatogram showing single spots for known colours A, C, D and E, no moving spot for B, and three spots for the black mixture. Two black spots line up with A and E.</desc><rect width="610" height="380" rx="18" fill="#fffdf6"/><text x="26" y="28" fill="#19384b" font-family="sans-serif" font-size="18">Chromatogram: known food colours and black sample</text><rect x="45" y="52" width="420" height="260" fill="white" stroke="#19384b" stroke-width="2"/><line x1="45" y1="74" x2="465" y2="74" stroke="#19384b" stroke-width="2"/><line x1="45" y1="278" x2="465" y2="278" stroke="#19384b" stroke-width="2"/><g fill="#657c90"><circle cx="80" cy="235" r="10"/><circle cx="140" cy="278" r="8"/><circle cx="200" cy="205" r="10"/><circle cx="260" cy="160" r="10"/><circle cx="320" cy="184" r="10"/></g><g fill="#333"><circle cx="402" cy="235" r="10"/><circle cx="402" cy="184" r="10"/><circle cx="402" cy="110" r="10"/></g><g fill="#19384b" font-family="sans-serif" font-size="18"><text x="73" y="341">A</text><text x="133" y="341">B</text><text x="193" y="341">C</text><text x="253" y="341">D</text><text x="313" y="341">E</text><text x="375" y="341">Black</text><text x="476" y="80" font-size="15">solvent front</text><text x="476" y="284" font-size="15">start line</text></g></svg>
