<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" role="img" aria-labelledby="title desc">
  <title id="title">Chromatogram of reference food colours and black sample</title>
  <desc id="desc">Reference samples A to E and a black mixture are shown on the same chromatogram. The black sample has three spots; two align exactly with A and E.</desc>
  <defs>
    <filter id="paperShadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17384a" flood-opacity="0.10"/></filter>
    <filter id="spotShadow" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#17384a" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="900" height="675" rx="24" fill="#fffdf8"/>
  <text x="48" y="62" fill="#112f46" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="32">Reference food colours and unknown sample</text>
  <text x="48" y="92" fill="#60747f" font-family="Arial,Helvetica,sans-serif" font-size="17">Compare spots at the same height to identify components of the black sample.</text>

  <g filter="url(#paperShadow)">
    <rect x="72" y="122" width="660" height="420" rx="3" fill="#ffffff" stroke="#3f5f6e" stroke-width="3.5"/>
  </g>
  <line x1="72" y1="170" x2="732" y2="170" stroke="#17384a" stroke-width="3" stroke-dasharray="11 8"/>
  <line x1="72" y1="500" x2="732" y2="500" stroke="#17384a" stroke-width="3.5"/>

  <g filter="url(#spotShadow)">
    <circle cx="150" cy="410" r="19" fill="#8197a7" stroke="#687f90" stroke-width="2.2"/>
    <circle cx="245" cy="500" r="14" fill="#8197a7" stroke="#687f90" stroke-width="2.2"/>
    <circle cx="340" cy="360" r="19" fill="#8197a7" stroke="#687f90" stroke-width="2.2"/>
    <circle cx="435" cy="290" r="19" fill="#8197a7" stroke="#687f90" stroke-width="2.2"/>
    <circle cx="530" cy="330" r="19" fill="#8197a7" stroke="#687f90" stroke-width="2.2"/>

    <circle cx="650" cy="410" r="19" fill="#2f3f4c" stroke="#22303b" stroke-width="2.2"/>
    <circle cx="650" cy="330" r="19" fill="#2f3f4c" stroke="#22303b" stroke-width="2.2"/>
    <circle cx="650" cy="220" r="19" fill="#2f3f4c" stroke="#22303b" stroke-width="2.2"/>
  </g>

  <g fill="#15364a" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">
    <text x="150" y="592">A</text><text x="245" y="592">B</text><text x="340" y="592">C</text><text x="435" y="592">D</text><text x="530" y="592">E</text><text x="650" y="592">Black</text>
  </g>

  <g stroke="#536f7a" stroke-width="2.2" fill="none">
    <line x1="732" y1="170" x2="762" y2="170"/><line x1="732" y1="500" x2="762" y2="500"/>
  </g>
  <g fill="#365363" font-family="Arial,Helvetica,sans-serif" font-size="18">
    <text x="772" y="166">Solvent</text><text x="772" y="190">front</text><text x="772" y="506">Start line</text>
  </g>
</svg>
