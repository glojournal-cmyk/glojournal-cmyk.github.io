<title id="title">Figure 3: chromatogram and millimetre ruler</title><desc id="desc">A chromatogram has a start line, blue spot and solvent front aligned to a millimetre ruler. Distances on the ruler are measured from the start line.</desc>
<rect width="640" height="430" rx="18" fill="#fcfbf6"/>
<text x="28" y="38" fill="#17384a" font-family="Arial,sans-serif" font-weight="700" font-size="21">Figure 3 · Measure from the start line</text>
<text x="28" y="64" fill="#536a71" font-family="Arial,sans-serif" font-size="15">Read to the centre of the spot and to the solvent front.</text>
<rect x="135" y="76" width="224" height="300" fill="#fff" stroke="#49636e" stroke-width="3"/>
<path d="M135 335H359" stroke="#17384a" stroke-width="3"/><path d="M135 105H359" stroke="#17384a" stroke-width="3" stroke-dasharray="8 5"/>
<circle cx="247" cy="197" r="17" fill="#68a6db" opacity=".9"/><circle cx="247" cy="197" r="4" fill="#153f79"/>
<path d="M455 59V335" stroke="#17384a" stroke-width="2.5"/>
<g stroke="#17384a" stroke-width="2"><path d="M455 335h22 M455 289h14 M455 243h14 M455 197h22 M455 151h14 M455 105h22 M455 59h14"/></g>
<g fill="#17384a" font-family="Arial,sans-serif" font-size="18"><text x="488" y="341">0</text><text x="488" y="295">10</text><text x="488" y="249">20</text><text x="488" y="203">30</text><text x="488" y="157">40</text><text x="488" y="111">50</text><text x="488" y="65">60</text></g>
