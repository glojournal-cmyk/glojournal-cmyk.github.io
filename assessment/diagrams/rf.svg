<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" role="img" aria-labelledby="title desc">
  <title id="title">Figure 3: chromatogram and millimetre ruler</title>
  <desc id="desc">The start line is zero millimetres. The blue dye has travelled 30 millimetres and the solvent front 50 millimetres.</desc>
  <defs>
    <filter id="paperShadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17384a" flood-opacity="0.10"/></filter>
    <filter id="spotShadow" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#17384a" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="900" height="675" rx="24" fill="#fffdf8"/>
  <text x="48" y="58" fill="#112f46" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="32">Figure 3 · Measure from the start line</text>
  <text x="48" y="88" fill="#60747f" font-family="Arial,Helvetica,sans-serif" font-size="17">Read to the centre of the spot and to the solvent front.</text>

  <g filter="url(#paperShadow)">
    <rect x="170" y="126" width="310" height="430" rx="3" fill="#ffffff" stroke="#3f5f6e" stroke-width="3.5"/>
  </g>
  <line x1="170" y1="200" x2="480" y2="200" stroke="#17384a" stroke-width="3" stroke-dasharray="11 8"/>
  <line x1="170" y1="500" x2="480" y2="500" stroke="#17384a" stroke-width="3.5"/>

  <g filter="url(#spotShadow)">
    <circle cx="325" cy="320" r="24" fill="#6ba9df" stroke="#4f8fc8" stroke-width="2.5"/>
    <circle cx="325" cy="320" r="6" fill="#174f89"/>
  </g>

  <g stroke="#17384a" fill="none">
    <line x1="605" y1="140" x2="605" y2="500" stroke-width="3"/>
    <line x1="605" y1="500" x2="640" y2="500" stroke-width="3"/>
    <line x1="605" y1="440" x2="630" y2="440" stroke-width="2.5"/>
    <line x1="605" y1="380" x2="630" y2="380" stroke-width="2.5"/>
    <line x1="605" y1="320" x2="640" y2="320" stroke-width="3"/>
    <line x1="605" y1="260" x2="630" y2="260" stroke-width="2.5"/>
    <line x1="605" y1="200" x2="640" y2="200" stroke-width="3"/>
    <line x1="605" y1="140" x2="630" y2="140" stroke-width="2.5"/>
  </g>

  <g fill="#15364a" font-family="Arial,Helvetica,sans-serif" font-size="22">
    <text x="658" y="508">0</text><text x="658" y="448">10</text><text x="658" y="388">20</text><text x="658" y="328">30</text><text x="658" y="268">40</text><text x="658" y="208">50</text><text x="658" y="148">60</text>
  </g>
  <text x="603" y="555" fill="#526b77" font-family="Arial,Helvetica,sans-serif" font-size="19">Distance / mm</text>
  <text x="170" y="600" fill="#526b77" font-family="Arial,Helvetica,sans-serif" font-size="19">Start line = 0 mm</text>

  <g stroke="#9db0b8" stroke-width="1.5" stroke-dasharray="5 6" opacity="0.6">
    <line x1="480" y1="320" x2="605" y2="320"/>
    <line x1="480" y1="200" x2="605" y2="200"/>
  </g>
</svg>
