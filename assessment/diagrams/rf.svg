<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 350" role="img" aria-labelledby="title desc"><title id="title">Chromatogram with a millimetre scale</title><desc id="desc">Start line at 5 millimetres, centre of blue dye spot at 35 millimetres, and solvent front at 55 millimetres. Both travel distances must be measured from the start line.</desc><rect width="440" height="350" rx="18" fill="#fffdf6"/><rect x="92" y="35" width="130" height="280" fill="#fff" stroke="#18364a" stroke-width="2"/><line x1="92" y1="58" x2="222" y2="58" stroke="#18364a" stroke-width="2" stroke-dasharray="6 4"/><line x1="92" y1="292" x2="222" y2="292" stroke="#18364a" stroke-width="2"/><circle cx="157" cy="152" r="13" fill="#3684d5" opacity=".8"/><circle cx="157" cy="152" r="3" fill="#174c8d"/><line x1="272" y1="35" x2="272" y2="315" stroke="#18364a" stroke-width="2"/><g stroke="#18364a" font-family="sans-serif" font-size="16" fill="#18364a"><path d="M272 315h18 M272 268h18 M272 222h18 M272 175h18 M272 128h18 M272 82h18 M272 35h18"/><text x="299" y="321">0</text><text x="299" y="274">10</text><text x="299" y="228">20</text><text x="299" y="181">30</text><text x="299" y="134">40</text><text x="299" y="88">50</text><text x="299" y="41">60 mm</text></g><text x="20" y="28" font-family="sans-serif" font-size="15" fill="#18364a">Figure 3 · Read from start line to centre of spot</text></svg>
