<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" role="img" aria-labelledby="title desc"><title id="title">Chromatogram for inks A, B, C and D</title><desc id="desc">A has one red spot. B has purple, blue and green spots. C has one orange spot. D has yellow and brown spots. Yellow is nearest the solvent front.</desc><rect width="520" height="350" rx="18" fill="#fffdf6"/><rect x="100" y="35" width="300" height="265" fill="#fff" stroke="#18364a" stroke-width="2"/><line x1="100" y1="70" x2="400" y2="70" stroke="#18364a" stroke-width="2" stroke-dasharray="7 5"/><line x1="100" y1="275" x2="400" y2="275" stroke="#18364a" stroke-width="2"/><g opacity=".9"><circle cx="135" cy="170" r="11" fill="#d4474c"/><circle cx="205" cy="105" r="11" fill="#8753a0"/><circle cx="205" cy="170" r="11" fill="#367fd1"/><circle cx="205" cy="235" r="11" fill="#61a450"/><circle cx="275" cy="140" r="11" fill="#e5903e"/><circle cx="350" cy="95" r="11" fill="#edcf2b"/><circle cx="350" cy="170" r="11" fill="#8d5630"/></g><g fill="#18364a" font-family="sans-serif" font-size="18"><text x="127" y="328">A</text><text x="197" y="328">B</text><text x="267" y="328">C</text><text x="342" y="328">D</text><text x="405" y="75" font-size="14">solvent front</text></g></svg>
