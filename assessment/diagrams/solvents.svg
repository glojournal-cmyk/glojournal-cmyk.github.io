<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="title desc">
<title id="title">Figure 4: two solvents separating identical dye samples</title><desc id="desc">Two chromatograms compare the same three dyes using water and ethanol. Examine the spacing of their spots.</desc>
<rect width="640" height="430" rx="18" fill="#fcfbf6"/>
<text x="28" y="38" fill="#17384a" font-family="Arial,sans-serif" font-weight="700" font-size="21">Figure 4 · Same dyes, different solvents</text>
<text x="28" y="64" fill="#536a71" font-family="Arial,sans-serif" font-size="15">Compare how distinctly the three spots separate.</text>
<g fill="#fff" stroke="#49636e" stroke-width="3"><rect x="92" y="95" width="184" height="270"/><rect x="362" y="95" width="184" height="270"/></g>
<g stroke="#17384a" stroke-width="2.5"><path d="M92 329h184 M362 329h184"/><path d="M92 121h184 M362 121h184" stroke-dasharray="8 5"/></g>
<g opacity=".94"><circle cx="184" cy="153" r="15" fill="#d45559"/><circle cx="184" cy="220" r="15" fill="#3b7fbd"/><circle cx="184" cy="285" r="15" fill="#e8c749" stroke="#b79b30" stroke-width="2"/><circle cx="454" cy="213" r="15" fill="#d45559"/><circle cx="454" cy="239" r="15" fill="#3b7fbd"/><circle cx="454" cy="265" r="15" fill="#e8c749" stroke="#b79b30" stroke-width="2"/></g>
<g fill="#17384a" font-family="Arial,sans-serif" font-size="20" font-weight="700"><text x="154" y="399">Water</text><text x="420" y="399">Ethanol</text></g>
</svg>
