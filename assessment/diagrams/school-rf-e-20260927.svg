<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">Figure E: same dyes in water and ethanol</title><desc id="desc">The same three dyes are separated in water and ethanol. Water gives wider separation than ethanol.</desc>
<rect width="760" height="520" fill="#fff"/>
<text x="34" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17384a">Figure E · Same dyes, different solvents</text>
<text x="34" y="76" font-family="Arial,sans-serif" font-size="16" fill="#536a71">The same three dyes were tested under otherwise identical conditions.</text>
<rect x="85" y="110" width="240" height="300" fill="#fff" stroke="#4d626c" stroke-width="2.6"/><rect x="435" y="110" width="240" height="300" fill="#fff" stroke="#4d626c" stroke-width="2.6"/>
<path d="M85 366H325 M435 366H675" stroke="#17384a" stroke-width="3"/><path d="M85 145H325 M435 145H675" stroke="#17384a" stroke-width="2.3" stroke-dasharray="10 7"/>
<circle cx="205" cy="185" r="15" fill="#d45b60"/><circle cx="205" cy="255" r="15" fill="#4684bd"/><circle cx="205" cy="330" r="15" fill="#e4c64d" stroke="#ae9532" stroke-width="1.6"/>
<circle cx="555" cy="240" r="15" fill="#d45b60"/><circle cx="555" cy="270" r="15" fill="#4684bd"/><circle cx="555" cy="300" r="15" fill="#e4c64d" stroke="#ae9532" stroke-width="1.6"/>
<g font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17384a"><text x="176" y="454">Water</text><text x="516" y="454">Ethanol</text></g>
</svg>
