<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320" role="img" aria-label="Atom X with eight protons and nine neutrons, and eight surrounding electrons"><rect width="840" height="320" rx="16" fill="#faf8f1"/><rect x="1" y="1" width="838" height="318" rx="15" fill="none" stroke="#8b9a96" stroke-width="2"/><text x="30" y="36" font-family="Arial" font-size="23" font-weight="bold" fill="#183747">Atom X — schematic, not to scale</text><circle cx="418" cy="176" r="128" fill="none" stroke="#afbbb0" stroke-width="3"/><circle cx="418" cy="176" r="76" fill="none" stroke="#afbbb0" stroke-width="3"/><circle cx="418" cy="176" r="52" fill="#f0e4ca" stroke="#b89b6e" stroke-width="2"/><text x="418" y="166" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial">8 protons</text><text x="418" y="190" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial">9 neutrons</text><circle cx="418" cy="70" r="9" fill="#1e5771"/><text x="418" y="74" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">−</text><circle cx="542" cy="142" r="9" fill="#1e5771"/><text x="542" y="146" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">−</text><circle cx="542" cy="247" r="9" fill="#1e5771"/><text x="542" y="251" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">−</text><circle cx="418" cy="292" r="9" fill="#1e5771"/><text x="418" y="296" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">−</text><circle cx="294" cy="247" r="9" fill="#1e5771"/><text x="294" y="251" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">−</text><circle cx="294" cy="142" r="9" fill="#1e5771"/><text x="294" y="146" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">−</text><circle cx="343" cy="176" r="9" fill="#1e5771"/><circle cx="493" cy="176" r="9" fill="#1e5771"/><text x="90" y="127" font-family="Arial" font-size="19" fill="#183747">Electrons:</text><text x="90" y="157" font-family="Arial" font-size="19" fill="#183747">8 in total</text><path d="M212 162 L295 143" stroke="#183747" stroke-width="2"/><text x="640" y="183" font-family="Arial" font-size="18" fill="#183747">Nucleus</text><path d="M625 187 L475 179" stroke="#183747" stroke-width="2"/><text x="418" y="312" font-family="Arial" font-size="14" text-anchor="middle" fill="#435962">Blue dots = electrons (negative charge)</text></svg>
