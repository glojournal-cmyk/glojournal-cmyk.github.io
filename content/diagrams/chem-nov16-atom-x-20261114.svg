<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320" role="img" aria-label="Atom X has a nucleus with eight protons and nine neutrons and exactly eight electrons: two in the first shell and six in the second shell.">
  <title>Atom X: 8 protons, 9 neutrons and 8 electrons</title>
  <rect width="840" height="320" rx="16" fill="#faf8f1"/>
  <rect x="1" y="1" width="838" height="318" rx="15" fill="none" stroke="#8b9a96" stroke-width="2"/>
  <text x="30" y="37" font-family="Arial" font-size="23" font-weight="bold" fill="#183747">Atom X — schematic, not to scale</text>
  <circle cx="418" cy="176" r="114" fill="none" stroke="#9baea9" stroke-width="2.5"/>
  <circle cx="418" cy="176" r="72" fill="none" stroke="#9baea9" stroke-width="2.5"/>
  <circle cx="418" cy="176" r="42" fill="#f0e4ca" stroke="#b89b6e" stroke-width="2"/>
  <text x="418" y="170" font-size="15" font-weight="bold" text-anchor="middle" font-family="Arial" fill="#183747">8 protons</text>
  <text x="418" y="188" font-size="15" font-weight="bold" text-anchor="middle" font-family="Arial" fill="#183747">9 neutrons</text>
  <g aria-label="Two inner-shell electrons"><circle cx="346" cy="176" r="9" fill="#1e5771" stroke="#123b51" stroke-width="1.5"/><text x="346" y="180" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">−</text><circle cx="490" cy="176" r="9" fill="#1e5771" stroke="#123b51" stroke-width="1.5"/><text x="490" y="180" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">−</text></g>
  <g aria-label="Six outer-shell electrons"><circle cx="418" cy="62" r="9" fill="#1e5771" stroke="#123b51" stroke-width="1.5"/><text x="418" y="66" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">−</text><circle cx="517" cy="119" r="9" fill="#1e5771" stroke="#123b51" stroke-width="1.5"/><text x="517" y="123" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">−</text><circle cx="517" cy="233" r="9" fill="#1e5771" stroke="#123b51" stroke-width="1.5"/><text x="517" y="237" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">−</text><circle cx="418" cy="290" r="9" fill="#1e5771" stroke="#123b51" stroke-width="1.5"/><text x="418" y="294" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">−</text><circle cx="319" cy="233" r="9" fill="#1e5771" stroke="#123b51" stroke-width="1.5"/><text x="319" y="237" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">−</text><circle cx="319" cy="119" r="9" fill="#1e5771" stroke="#123b51" stroke-width="1.5"/><text x="319" y="123" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">−</text></g>
  <text x="80" y="127" font-family="Arial" font-size="19" fill="#183747">Electrons:</text>
  <text x="80" y="158" font-family="Arial" font-size="19" fill="#183747">8 in total</text>
  <path d="M203 162 L318 119" stroke="#183747" stroke-width="2" fill="none"/>
  <text x="647" y="171" font-family="Arial" font-size="18" fill="#183747">Nucleus</text>
  <path d="M631 177 L463 176" stroke="#183747" stroke-width="2" fill="none"/>
  <text x="418" y="312" font-family="Arial" font-size="14" text-anchor="middle" fill="#435962">Blue dots = negatively charged electrons</text>
</svg>
