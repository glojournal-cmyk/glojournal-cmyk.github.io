<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title"><title id="title">Illustrative graph with positive and negative percentage changes and a zero crossing; anchors A to D.</title><rect width="900" height="500" fill="#fffdf5"/><path d="M150 60 V405 H785" stroke="#233c50" stroke-width="3" fill="none"/><path d="M150 245 H785" stroke="#6d7d89" stroke-width="2" stroke-dasharray="8 6"/><path d="M180 110 L350 185 L480 245 L700 350" stroke="#476b61" stroke-width="5" fill="none"/><circle cx="480" cy="245" r="6" fill="#233c50"/><text x="110" y="115" text-anchor="middle" font-size="18" fill="#233c50">+20</text><text x="110" y="250" text-anchor="middle" font-size="18" fill="#233c50">0</text><text x="110" y="355" text-anchor="middle" font-size="18" fill="#233c50">−20</text><path d="M 430 460 L 430 405" stroke="#233c50" stroke-width="2"/><circle cx="430" cy="460" r="17" fill="#233c50"/><text x="430" y="466" fill="white" text-anchor="middle" font-size="20" font-weight="bold">A</text><path d="M 65 210 L 150 180" stroke="#233c50" stroke-width="2"/><circle cx="65" cy="210" r="17" fill="#233c50"/><text x="65" y="216" fill="white" text-anchor="middle" font-size="20" font-weight="bold">B</text><path d="M 775 200 L 710 245" stroke="#233c50" stroke-width="2"/><circle cx="775" cy="200" r="17" fill="#233c50"/><text x="775" y="206" fill="white" text-anchor="middle" font-size="20" font-weight="bold">C</text><path d="M 560 125 L 480 245" stroke="#233c50" stroke-width="2"/><circle cx="560" cy="125" r="17" fill="#233c50"/><text x="560" y="131" fill="white" text-anchor="middle" font-size="20" font-weight="bold">D</text></svg>