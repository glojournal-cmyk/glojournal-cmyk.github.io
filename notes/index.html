<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183c48">
<title>Notes Library · Lux et Labor</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/notes/library.css?v=20261023-study-cards1">
</head>
<body>
<div class="scene-tint" aria-hidden="true"></div>
<div class="notes-app">
  <header class="toolbar" aria-label="Notes navigation">
    <a class="study-back" href="/study/" aria-label="Return to Study">← Study</a>
    <label class="year-picker">
      <span class="sr-only">Select school year</span>
      <select id="yearSelect" aria-label="Select school year">
        <option value="year9">Year 9</option>
        <option value="summer">Summer / Year 8</option>
      </select>
    </label>
    <span class="notes-pill">📖 Notes Library</span>
  </header>
  <div class="cloud-status" id="status" role="status" aria-live="polite">Loading Notes Library…</div>
  <main>
    <section id="subjectScreen" class="subject-screen" aria-label="Notes subjects">
      <h1 class="sr-only">Choose a subject</h1>
      <div class="subject-grid" id="subjectGrid"></div>
    </section>
    <section id="detailScreen" class="detail-screen" aria-label="Subject PDF notes" hidden>
      <div class="detail-heading">
        <button id="backSubjects" class="back-subjects" type="button">← Subjects</button>
        <div class="detail-title-wrap">
          <span id="detailYear" class="detail-year"></span>
          <h1 id="detailTitle">Subject notes</h1>
          <span id="detailCount" class="detail-count"></span>
        </div>
      </div>
      <label class="sr-only" for="noteSearch">Search this subject's notes</label>
      <input id="noteSearch" type="search" placeholder="Search these notes…" autocomplete="off">
      <div id="noteList" class="note-list"></div>
      <p id="empty" class="empty" hidden>No Image PDF notes here yet.</p>
    </section>
  </main>
</div>
<div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-label="PDF Reader">
  <div class="viewer-bar">
    <button id="closeReader" type="button">← Notes</button>
    <strong id="viewerTitle"></strong>
    <a id="openTab" target="_blank" rel="noopener noreferrer">Full screen ↗</a>
  </div>
  <iframe id="pdfFrame" title="PDF notes" loading="lazy"></iframe>
</div>
<nav class="bottom-nav" aria-label="Main navigation">
  <a href="/"><img src="/assets/math-study/nav/home.svg" alt=""><span>Home</span></a>
  <a class="active" href="/study/"><img src="/assets/math-study/nav/study.svg" alt=""><span>Study</span></a>
  <a href="/play/"><img src="/assets/math-study/nav/play.svg" alt=""><span>Play</span></a>
  <a href="/garden/"><img src="/assets/math-study/nav/garden.svg" alt=""><span>Garden</span></a>
  <a href="/pet/"><img src="/assets/math-study/nav/pet.svg" alt=""><span>Pet</span></a>
  <a href="/assessment/"><img src="/assets/math-study/nav/assessment.svg" alt=""><span>Assessment</span></a>
  <a href="/scholar/"><img src="/assets/math-study/nav/scholar.svg" alt=""><span>Scholar</span></a>
</nav>
<script src="/notes/library.js?v=20261023-study-cards1" defer></script>
</body>
</html>
